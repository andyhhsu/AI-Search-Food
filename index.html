<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>美食探險家</title>
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="美食探險家">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/ea580c/ffffff?text=食">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #ea580c;
            --primary-dark: #c2410c;
            --bg-color: #fafaf9;
        }
        body {
            font-family: 'Poppins', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 100px;
        }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes slide-up-fade {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-enter {
            animation: slide-up-fade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        body.modal-open {
            overflow: hidden;
        }
    </style>
</head>
<body class="text-stone-800">

    <!-- 1. 頂部導航與搜尋控制區 -->
    <header id="main-header" class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-stone-200 shadow-sm transition-all duration-200">
        <div class="max-w-5xl mx-auto px-4 py-2.5">
            
            <!-- 第一列：Logo、地區設定觸發條、收藏切換 -->
            <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2 flex-shrink-0 cursor-pointer" onclick="switchTab('explore')">
                    <div class="w-8 h-8 bg-gradient-to-tr from-orange-600 to-amber-500 rounded-xl flex items-center justify-center text-white font-black text-base shadow-sm">食</div>
                    <span class="text-base font-black tracking-tight text-stone-900 hidden sm:inline">美食探險家</span>
                </div>

                <!-- 地區選擇觸發膠囊 -->
                <button type="button" onclick="openBottomSheet('area')" class="flex-grow max-w-md bg-stone-100 hover:bg-stone-200/80 active:scale-[0.99] rounded-full px-3.5 py-2 flex items-center justify-between gap-2 text-xs font-bold text-stone-700 transition-all border border-stone-200/60">
                    <div class="flex items-center gap-1.5 truncate">
                        <span class="text-orange-600 flex-shrink-0">📍</span>
                        <span id="header-area-label" class="truncate">目前位置附近</span>
                        <span class="text-stone-300">|</span>
                        <span id="header-cuisine-label" class="text-orange-600 truncate">所有美食</span>
                    </div>
                    <span class="text-[11px] text-stone-400 flex-shrink-0 bg-white px-2 py-0.5 rounded-full border border-stone-200">換地區 ▾</span>
                </button>

                <!-- 收藏頁切換按鈕 -->
                <button type="button" id="fav-tab-btn" onclick="switchTab('favorites')" class="flex-shrink-0 relative bg-stone-100 hover:bg-rose-50 text-stone-700 px-3 py-2 rounded-full text-xs font-bold flex items-center gap-1 border border-stone-200/60 transition-all active:scale-95">
                    <span>❤️</span>
                    <span class="hidden sm:inline">收藏</span>
                    <span id="fav-count-badge" class="bg-rose-500 text-white text-[10px] font-extrabold px-1.5 py-0.2 rounded-full">0</span>
                </button>
            </div>

            <!-- 可收折展開區 -->
            <div id="header-expandable" class="mt-2.5 space-y-2.5 overflow-hidden transition-all duration-200">
                
                <!-- 第二列：交通方式 + 手動搜尋食物輸入框 -->
                <div class="flex flex-col sm:flex-row gap-2">
                    <!-- 步行 / 開車 切換 -->
                    <div class="flex bg-stone-100 p-1 rounded-xl border border-stone-200/70 flex-shrink-0">
                        <button type="button" id="mode-walking-btn" onclick="setTransportMode('walking')" class="flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition-all bg-orange-600 text-white shadow-sm">
                            <span>🚶</span> 步行 10分內
                        </button>
                        <button type="button" id="mode-driving-btn" onclick="setTransportMode('driving')" class="flex-1 sm:flex-initial px-3.5 py-1.5 rounded-lg text-xs font-bold flex items-center justify-center gap-1 transition-all text-stone-600 hover:text-stone-900">
                            <span>🚗</span> 開車 5公里
                        </button>
                    </div>

                    <!-- 手動輸入食物種類或店名搜尋欄 -->
                    <form id="custom-cuisine-form" onsubmit="handleCustomFoodSubmit(event)" class="flex-grow flex gap-1.5">
                        <div class="relative flex-grow">
                            <input type="text" id="custom-cuisine-input" placeholder="手動輸入想吃的食物或店名 (例：酸菜魚、拉麵、燒肉)..." class="w-full bg-stone-100 focus:bg-white border border-stone-200 focus:border-orange-500 rounded-xl pl-3.5 pr-8 py-1.5 text-xs font-medium text-stone-800 outline-none transition-all">
                            <button type="button" id="clear-cuisine-btn" onclick="clearCustomCuisine()" class="hidden absolute right-2 top-1/2 -translate-y-1/2 text-stone-400 hover:text-stone-600 p-1 text-xs">✕</button>
                        </div>
                        <button type="submit" class="bg-stone-900 hover:bg-stone-800 active:scale-95 text-white px-4 py-1.5 rounded-xl text-xs font-bold flex-shrink-0 transition-all shadow-sm">
                            搜尋
                        </button>
                    </form>
                </div>

                <!-- 第三列：美食種類快速標籤雲 (全展開免橫滑) -->
                <div id="cuisine-tags-wrapper" class="flex flex-wrap gap-1.5 items-center pt-0.5">
                    <!-- 動態自訂關鍵字標籤與最近紀錄插入點 -->
                    <span id="dynamic-custom-tags" class="contents"></span>

                    <button type="button" onclick="quickSearch('')" data-cuisine="" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-orange-600 text-white border-orange-600 shadow-sm">
                        🍽️ 全部好店
                    </button>
                    <button type="button" onclick="quickSearch('咖啡廳')" data-cuisine="咖啡廳" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">
                        ☕ 咖啡廳
                    </button>
                    <button type="button" onclick="quickSearch('火鍋')" data-cuisine="火鍋" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">
                        🍲 火鍋
                    </button>
                    <button type="button" onclick="quickSearch('日式料理')" data-cuisine="日式料理" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">
                        🍣 日式料理
                    </button>
                    <button type="button" onclick="quickSearch('牛肉麵')" data-cuisine="牛肉麵" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">
                        🍜 牛肉麵
                    </button>
                    <button type="button" onclick="quickSearch('早午餐')" data-cuisine="早午餐" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">
                        🥞 早午餐
                    </button>
                    <button type="button" onclick="quickSearch('甜點')" data-cuisine="甜點" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">
                        🍰 甜點
                    </button>
                    <button type="button" onclick="quickSearch('小吃')" data-cuisine="小吃" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">
                        🥟 小吃
                    </button>

                    <!-- 更多種類展開區 -->
                    <span id="more-cuisine-tags" class="hidden contents">
                        <button type="button" onclick="quickSearch('韓式料理')" data-cuisine="韓式料理" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">🥘 韓式料理</button>
                        <button type="button" onclick="quickSearch('義大利麵')" data-cuisine="義大利麵" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">🍝 義大利麵</button>
                        <button type="button" onclick="quickSearch('美式漢堡')" data-cuisine="美式漢堡" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">🍔 美式漢堡</button>
                        <button type="button" onclick="quickSearch('泰式料理')" data-cuisine="泰式料理" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">🌶️ 泰式料理</button>
                        <button type="button" onclick="quickSearch('燒肉')" data-cuisine="燒肉" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">🥩 燒肉</button>
                        <button type="button" onclick="quickSearch('居酒屋')" data-cuisine="居酒屋" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">🍺 居酒屋</button>
                        <button type="button" onclick="quickSearch('麵包店')" data-cuisine="麵包店" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">🍞 麵包店</button>
                        <button type="button" onclick="quickSearch('素食')" data-cuisine="素食" class="cuisine-chip px-3 py-1.5 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white text-stone-600 border-stone-200 hover:border-orange-300">🥗 素食</button>
                    </span>

                    <button type="button" id="toggle-more-tags-btn" onclick="toggleMoreTags()" class="px-2.5 py-1.5 rounded-xl text-xs font-bold bg-stone-100 text-stone-600 hover:bg-stone-200 transition-all">
                        ＋ 更多種類
                    </button>
                </div>
            </div>
        </div>

        <!-- 二次快篩與排序控制列 (有搜尋結果時顯示) -->
        <div id="secondary-filter-bar" class="hidden bg-stone-50 border-t border-stone-200/80 px-4 py-2">
            <div class="max-w-5xl mx-auto flex flex-wrap items-center justify-between gap-2">
                <!-- 排序切換 -->
                <div class="flex items-center gap-1 bg-white p-0.5 rounded-lg border border-stone-200">
                    <button type="button" onclick="setSortMode('bayesian')" data-sort="bayesian" class="sort-btn px-2.5 py-1 rounded-md text-xs font-bold bg-stone-900 text-white transition-all">🏆 老饕權重</button>
                    <button type="button" onclick="setSortMode('reviews')" data-sort="reviews" class="sort-btn px-2.5 py-1 rounded-md text-xs font-bold text-stone-600 hover:bg-stone-100 transition-all">🔥 評論數</button>
                    <button type="button" onclick="setSortMode('distance')" data-sort="distance" class="sort-btn px-2.5 py-1 rounded-md text-xs font-bold text-stone-600 hover:bg-stone-100 transition-all">📍 距離</button>
                </div>

                <!-- 營業中 + 檢視模式切換 -->
                <div class="flex items-center gap-1.5">
                    <button type="button" id="filter-open-btn" onclick="toggleFilterOpenNow()" class="px-2.5 py-1 rounded-lg text-xs font-bold border border-stone-200 bg-white text-stone-600 transition-all flex items-center gap-1">
                        <span>🟢</span> 僅看營業中
                    </button>
                    <button type="button" id="view-mode-btn" onclick="toggleViewMode()" class="px-2.5 py-1 rounded-lg text-xs font-bold border border-stone-200 bg-white text-stone-700 hover:bg-stone-100 transition-all" title="切換大圖/緊湊清單">
                        📑 緊湊清單
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 2. 主要內容區 -->
    <main class="w-full max-w-5xl mx-auto px-4 pt-4">
        
        <!-- 狀態與錯誤提示框 -->
        <div id="error-container" class="hidden mb-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-2xl text-xs font-bold flex items-center justify-between gap-3">
            <span id="error-message-text"></span>
            <button type="button" onclick="openBottomSheet('area')" class="bg-red-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold flex-shrink-0">手動選地區</button>
        </div>

        <!-- 日本地區動態門檻提示 -->
        <div id="japan-mode-banner" class="hidden mb-4 bg-amber-50 border border-amber-200 text-amber-800 px-4 py-2.5 rounded-2xl text-xs font-bold flex items-center justify-between">
            <span>🇯🇵 已啟用日本在地老饕標準：篩選門檻自動調整為 3.5★ 以上，並支援 Tabelog 一鍵查驗！</span>
        </div>

        <!-- 探索結果列表 -->
        <section id="explore-section">
            <div id="results-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- 初始引導狀態 -->
                <div class="col-span-full flex flex-col items-center justify-center py-16 text-center">
                    <div class="w-20 h-20 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center mb-4 text-4xl shadow-inner">
                        🍜
                    </div>
                    <h2 class="text-lg font-black text-stone-800 mb-1">準備好探索身邊美食了嗎？</h2>
                    <p class="text-xs text-stone-500 max-w-xs mb-5">直接點擊上方「美食標籤」或輸入想吃的料理，立即找出高評價、高評論數的實力好店！</p>
                    <div class="flex gap-2">
                        <button type="button" onclick="quickSearch('')" class="bg-orange-600 hover:bg-orange-700 text-white font-bold px-5 py-2.5 rounded-xl text-xs shadow-md active:scale-95 transition-all">
                            📍 立即搜尋附近好店
                        </button>
                        <button type="button" onclick="openBottomSheet('area')" class="bg-white border border-stone-300 text-stone-700 font-bold px-4 py-2.5 rounded-xl text-xs active:scale-95 transition-all">
                            🗺️ 選擇指定地區
                        </button>
                    </div>
                </div>
            </div>

            <!-- 載入更多按鈕區 -->
            <div id="pagination-container" class="w-full flex justify-center mt-6 mb-8"></div>
        </section>

        <!-- 收藏夾列表 (預設隱藏) -->
        <section id="favorites-section" class="hidden">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-black text-stone-800 flex items-center gap-2">❤️ 我的口袋收藏名單</h2>
                <button type="button" onclick="switchTab('explore')" class="text-xs font-bold text-orange-600 bg-orange-50 px-3 py-1.5 rounded-lg">← 返回搜尋結果</button>
            </div>
            <div id="favorites-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>
    </main>

    <!-- 3. 右下角浮動工具按鈕 (隨機選店 & 回到頂部) -->
    <div class="fixed bottom-5 right-4 z-30 flex flex-col items-end gap-2.5">
        <button type="button" id="roulette-fab" onclick="openRoulette()" class="hidden bg-gradient-to-r from-orange-600 to-amber-500 text-white px-4 py-3 rounded-full shadow-lg font-bold text-xs flex items-center gap-1.5 active:scale-95 transition-all">
            <span class="text-base">🎲</span> 幫我選一家
        </button>
        <button type="button" id="back-to-top-btn" onclick="scrollToTop()" class="hidden bg-stone-900/90 text-white p-3 rounded-full shadow-lg active:scale-95 transition-all">
            <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
        </button>
    </div>

    <!-- 4. 底部搜尋設定面板 (Bottom Sheet - 確保 hidden 隔離，絕不阻擋點擊) -->
    <div id="bottom-sheet-overlay" onclick="closeBottomSheet()" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-40 transition-opacity"></div>
    <div id="bottom-sheet" class="hidden fixed bottom-0 left-0 right-0 bg-white z-50 rounded-t-3xl shadow-2xl max-h-[85vh] flex flex-col">
        <!-- 頂部拉柄與標題 -->
        <div class="px-6 pt-4 pb-3 border-b border-stone-100 flex items-center justify-between flex-shrink-0">
            <h3 id="sheet-title" class="text-base font-black text-stone-800">選擇搜尋地區</h3>
            <button type="button" onclick="closeBottomSheet()" class="p-2 bg-stone-100 hover:bg-stone-200 rounded-full text-stone-600 text-xs font-bold">✕</button>
        </div>

        <!-- 可垂直捲動的內容區 -->
        <div class="p-5 overflow-y-auto flex-grow space-y-5 overscroll-contain">
            <!-- 自訂地區輸入框 -->
            <div>
                <label class="text-xs font-bold text-stone-500 block mb-2">✏️ 手動輸入任何城市、行政區或地標（支援台灣、日本與全球）</label>
                <div class="flex gap-2">
                    <input type="text" id="custom-area-input" placeholder="例如：台中西區、東京新宿、大阪難波..." class="flex-grow bg-stone-100 border border-stone-300 focus:border-orange-500 focus:bg-white rounded-xl px-3.5 py-2.5 text-sm outline-none">
                    <button type="button" onclick="confirmCustomArea()" class="bg-orange-600 text-white px-5 rounded-xl font-bold text-xs flex-shrink-0 active:scale-95">確認設定</button>
                </div>
            </div>

            <!-- 最近搜尋地區紀錄 -->
            <div id="recent-areas-box" class="hidden">
                <label class="text-xs font-bold text-stone-400 block mb-2">🕒 最近搜尋地點</label>
                <div id="recent-areas-list" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- 熱門快速地區列表 -->
            <div>
                <label class="text-xs font-bold text-stone-400 block mb-2">📍 快速選擇熱門地區</label>
                <div id="area-options-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div>
            </div>
        </div>
    </div>

    <!-- 5. 隨機抽籤輪盤 Modal -->
    <div id="roulette-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl text-center relative">
            <button type="button" onclick="closeRoulette()" class="absolute top-4 right-4 w-8 h-8 bg-stone-100 rounded-full text-stone-500 font-bold">✕</button>
            <div class="text-4xl mb-2">🎰</div>
            <h3 class="text-lg font-black text-stone-900 mb-1">今天吃這家！</h3>
            <p class="text-xs text-stone-500 mb-4">從目前篩選出的高評價好店中為您隨機欽點</p>
            <div id="roulette-result-box" class="bg-stone-50 border border-stone-200 rounded-2xl p-4 mb-4 text-left"></div>
            <div class="flex gap-2">
                <button type="button" onclick="spinRoulette()" class="flex-1 bg-stone-100 hover:bg-stone-200 text-stone-800 font-bold py-3 rounded-xl text-xs active:scale-95">🔄 再抽一次</button>
                <a id="roulette-nav-link" href="#" target="_blank" class="flex-1 bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 rounded-xl text-xs flex items-center justify-center gap-1 active:scale-95">🗺️ 立即導航</a>
            </div>
        </div>
    </div>

    <!-- 6. 輕量通知 Toast -->
    <div id="toast-box" class="hidden fixed top-16 left-1/2 -translate-x-1/2 z-50 bg-stone-900/95 text-white px-4 py-2.5 rounded-full shadow-xl text-xs font-bold transition-all"></div>

    <script>
        // ==========================================
        // 1. 安全儲存封裝 (防止 file:// 或無痕模式崩潰)
        // ==========================================
        const memoryStore = {};
        const safeStorage = {
            get(key, fallback) {
                try {
                    const val = window.localStorage.getItem(key);
                    return val ? JSON.parse(val) : fallback;
                } catch (e) {
                    return memoryStore[key] !== undefined ? memoryStore[key] : fallback;
                }
            },
            set(key, value) {
                try {
                    memoryStore[key] = value;
                    window.localStorage.setItem(key, JSON.stringify(value));
                } catch (e) {
                    memoryStore[key] = value;
                }
            }
        };

        // ==========================================
        // 2. 全域狀態管理與快取池
        // ==========================================
        const state = {
            area: 'current_location',
            areaName: '目前位置附近',
            cuisine: '',
            cuisineName: '所有美食',
            mode: 'walking',       // 'walking' (10分) | 'driving' (5km)
            sortBy: 'bayesian',    // 'bayesian' | 'reviews' | 'distance'
            onlyOpenNow: false,
            compactView: false,
            isJapan: false,
            activeTab: 'explore',  // 'explore' | 'favorites'
            moreTagsExpanded: false
        };

        function getUserLocation(silent = false) {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    if (!silent) showError('您的瀏覽器不支援定位功能，請點選右方按鈕手動選擇地區。');
                    reject(new Error('不支援定位'));
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        currentUserLocation = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                        resolve(currentUserLocation);
                    },
                    (err) => {
                        currentUserLocation = null;
                        if (!silent) {
                            showError('無法取得目前定位（可能因本地檔案限制或未授權），請改用「手動選地區」即可正常搜尋！');
                        }
                        reject(err);
                    },
                    { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 }
                );
            });
        }

        async function performSearch(isInitial = true) {
            hideError();
            updateHeaderStatusUI();

            // 1. 立即呈現骨架屏，讓使用者感受到按鈕即時反應
            if (isInitial) {
                candidatePlaces = [];
                loadedDetailedPlaces = [];
                candidateCursor = 0;
                document.getElementById('pagination-container').innerHTML = '';
                showLoadingSkeleton();
            }

            // 2. 確保 Google Maps API 已就緒
            if (!ensureMapServices()) {
                // 等待 800ms 再試一次
                await new Promise(r => setTimeout(r, 800));
                if (!ensureMapServices()) {
                    document.getElementById('results-container').innerHTML = '';
                    showError('Google Maps API 尚未完成載入，請確認網路連線或 API 金鑰網域授權設定。');
                    return;
                }
            }

            try {
                let searchCenter = null;

                if (state.area === 'current_location') {
                    if (!currentUserLocation) {
                        await getUserLocation(false);
                    }
                    searchCenter = currentUserLocation;
                } else {
                    const geoData = await geocodeAddress(state.area);
                    searchCenter = geoData.location;
                    state.isJapan = geoData.isJapan;
                }

                // 抓取候選名單並做免費直線距離初篩
                if (isInitial) {
                    const rawList = await fetchCandidatePlaces(state.area, searchCenter);
                    document.getElementById('japan-mode-banner').classList.toggle('hidden', !state.isJapan);

                    if (rawList.length === 0) {
                        document.getElementById('secondary-filter-bar').classList.add('hidden');
                        document.getElementById('roulette-fab').classList.add('hidden');
                        document.getElementById('results-container').innerHTML = `
                            <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-stone-200 p-6">
                                <div class="text-4xl mb-2">🥲</div>
                                <h3 class="font-black text-stone-800 mb-1">此範圍內找不到符合標準的餐廳</h3>
                                <p class="text-xs text-stone-500 mb-4">建議切換為「🚗 開車 5 公里」擴大範圍，或換個美食關鍵字試試！</p>
                                <button type="button" onclick="setTransportMode('driving')" class="bg-orange-600 text-white px-4 py-2 rounded-xl text-xs font-bold">🚗 切換為 5 公里大範圍搜尋</button>
                            </div>
                        `;
                        return;
                    }

                    // 計算老饕貝氏加權分數並預排序
                    candidatePlaces = rawList.map(p => {
                        p._bayesian = calcBayesianScore(p.rating, p.user_ratings_total);
                        return p;
                    });
                    sortCandidates();
                }

                // 分批載入詳細資料與步行時間
                await loadMoreDetailsBatch(searchCenter);

            } catch (err) {
                document.getElementById('results-container').innerHTML = '';
                if (state.area === 'current_location' && !currentUserLocation) {
                    document.getElementById('results-container').innerHTML = `
                        <div class="col-span-full text-center py-12 bg-amber-50 rounded-3xl border border-amber-200 p-6">
                            <div class="text-3xl mb-2">📍</div>
                            <h3 class="font-black text-amber-900 mb-1">無法使用自動定位</h3>
                            <p class="text-xs text-amber-800 mb-4">瀏覽器目前阻擋了位置權限，請直接選擇一個行政區開始探索！</p>
                            <button type="button" onclick="openBottomSheet('area')" class="bg-orange-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold shadow-sm">🗺️ 點此選擇搜尋地區</button>
                        </div>
                    `;
                } else {
                    showError(err.message || '搜尋發生錯誤，請稍後再試');
                }
            }
        }

        // 貝氏加權評分公式：兼顧高評分與高評論數
        function calcBayesianScore(rating, reviews) {
            const C = state.isJapan ? 3.6 : 4.1;
            const m = 150;
            const v = reviews || 0;
            const R = rating || 0;
            return (v / (v + m)) * R + (m / (v + m)) * C;
        }

        function sortCandidates() {
            if (state.sortBy === 'bayesian') {
                candidatePlaces.sort((a, b) => (b._bayesian || 0) - (a._bayesian || 0));
            } else if (state.sortBy === 'reviews') {
                candidatePlaces.sort((a, b) => (b.user_ratings_total || 0) - (a.user_ratings_total || 0));
            } else if (state.sortBy === 'distance') {
                candidatePlaces.sort((a, b) => (a._straightDist || 999999) - (b._straightDist || 999999));
            }
        }

        function fetchCandidatePlaces(area, centerLoc) {
            return new Promise(async (resolve, reject) => {
                const keyword = state.cuisine || '餐廳 美食';
                const centerLatLng = centerLoc instanceof google.maps.LatLng
                    ? centerLoc
                    : new google.maps.LatLng(centerLoc.lat, centerLoc.lng);

                if (area === 'current_location') {
                    try {
                        const rev = await reverseGeocode(centerLatLng);
                        state.isJapan = rev.address_components.some(c => c.short_name === 'JP');
                    } catch (e) {
                        state.isJapan = false;
                    }
                }

                const minRating = state.isJapan ? 3.5 : 4.0;
                const maxRadius = (area === 'current_location' && state.mode === 'walking') ? 1100 : 5000;

                const request = {
                    location: centerLatLng,
                    radius: maxRadius,
                    keyword: area === 'current_location' ? keyword : `${area} ${keyword}`
                };

                let collected = [];
                let pageCount = 0;

                placesService.nearbySearch(request, (results, status, pagination) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                        // 免費幾何直線距離過濾 + 評分門檻過濾
                        const filtered = results.filter(p => {
                            if (!p.rating || p.rating < minRating || (p.user_ratings_total || 0) < 10) return false;
                            if (p.geometry && p.geometry.location) {
                                const dist = google.maps.geometry.spherical.computeDistanceBetween(centerLatLng, p.geometry.location);
                                p._straightDist = dist;
                                if (area === 'current_location' && dist > maxRadius) return false;
                            }
                            return true;
                        });

                        collected = collected.concat(filtered);
                        pageCount++;

                        if (pagination && pagination.hasNextPage && pageCount < 2 && collected.length < 36) {
                            setTimeout(() => pagination.nextPage(), 1800);
                        } else {
                            resolve(collected);
                        }
                    } else if (status === google.maps.places.PlacesServiceStatus.ZERO_RESULTS) {
                        resolve([]);
                    } else {
                        if (pageCount === 0) reject(new Error('搜尋服務回應異常 (' + status + ')'));
                        else resolve(collected);
                    }
                });
            });
        }

        // 先驗證步行時間，通過才呼叫 getDetails (大幅節省 API 並自動補齊筆數)
        async function loadMoreDetailsBatch(centerLoc) {
            const centerLatLng = centerLoc
                ? (centerLoc instanceof google.maps.LatLng ? centerLoc : new google.maps.LatLng(centerLoc.lat, centerLoc.lng))
                : (currentUserLocation ? new google.maps.LatLng(currentUserLocation.lat, currentUserLocation.lng) : null);

            let newlyAdded = 0;

            while (candidateCursor < candidatePlaces.length && newlyAdded < BATCH_TARGET) {
                const slice = candidatePlaces.slice(candidateCursor, candidateCursor + 6);
                candidateCursor += slice.length;

                const processed = await Promise.all(slice.map(async (basicPlace) => {
                    let distanceInfo = null;

                    if (centerLatLng && basicPlace.geometry && basicPlace.geometry.location) {
                        const straightMeters = basicPlace._straightDist || google.maps.geometry.spherical.computeDistanceBetween(centerLatLng, basicPlace.geometry.location);

                        if (state.area === 'current_location' && state.mode === 'walking') {
                            const route = await getWalkingRouteCached(centerLatLng, basicPlace.geometry.location, basicPlace.place_id);
                            if (!route || route.value > 660) {
                                return null; // 超過約 10~11 分鐘步行距離，直接淘汰不呼叫 getDetails
                            }
                            distanceInfo = route;
                        } else {
                            const text = straightMeters >= 1000 ? (straightMeters / 1000).toFixed(1) + ' km' : Math.round(straightMeters) + ' m';
                            distanceInfo = { text: `${text} (直線)`, value: straightMeters };
                        }
                    }

                    const detail = await getPlaceDetailsCached(basicPlace.place_id);
                    if (!detail) return null;

                    detail._bayesian = basicPlace._bayesian || calcBayesianScore(detail.rating, detail.user_ratings_total);
                    detail._straightDist = basicPlace._straightDist || 0;
                    detail.distanceData = distanceInfo;
                    placeDataMap[detail.place_id] = detail;
                    return detail;
                }));

                const validOnes = processed.filter(Boolean);
                loadedDetailedPlaces = loadedDetailedPlaces.concat(validOnes);
                newlyAdded += validOnes.length;
            }

            renderDisplayedResults();
        }

        // ==========================================
        // 7. 二次篩選、排序與卡片渲染
        // ==========================================
        window.setSortMode = function(sortMode) {

        };

        window.toggleFilterOpenNow = function() {
            state.onlyOpenNow = !state.onlyOpenNow;
            const btn = document.getElementById('filter-open-btn');
            if (state.onlyOpenNow) {
                btn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold border border-emerald-600 bg-emerald-600 text-white transition-all flex items-center gap-1';
            } else {
                btn.className = 'px-2.5 py-1 rounded-lg text-xs font-bold border border-stone-200 bg-white text-stone-600 transition-all flex items-center gap-1';
            }
            renderDisplayedResults();
        };

        window.toggleViewMode = function() {
            state.compactView = !state.compactView;
            const btn = document.getElementById('view-mode-btn');
            btn.textContent = state.compactView ? '🖼️ 大圖卡片' : '📑 緊湊清單';
            renderDisplayedResults();
        };

        function renderDisplayedResults() {
            const container = document.getElementById('results-container');
            const filterBar = document.getElementById('secondary-filter-bar');
            const rouletteFab = document.getElementById('roulette-fab');

            if (loadedDetailedPlaces.length > 0) {
                filterBar.classList.remove('hidden');
                rouletteFab.classList.remove('hidden');
            }

            let list = [...loadedDetailedPlaces];

            // 僅看營業中過濾
            if (state.onlyOpenNow) {
                list = list.filter(p => {
                    try { return p.opening_hours && p.opening_hours.isOpen(); }
                    catch (e) { return true; }
                });
            }

            // 排序
            if (state.sortBy === 'bayesian') {
                list.sort((a, b) => (b._bayesian || 0) - (a._bayesian || 0));
            } else if (state.sortBy === 'reviews') {
                list.sort((a, b) => (b.user_ratings_total || 0) - (a.user_ratings_total || 0));
            } else if (state.sortBy === 'distance') {
                list.sort((a, b) => {
                    const da = a.distanceData ? a.distanceData.value : (a._straightDist || 999999);
                    const db = b.distanceData ? b.distanceData.value : (b._straightDist || 999999);
                    return da - db;
                });
            }

            container.className = state.compactView
                ? 'grid grid-cols-1 md:grid-cols-2 gap-2.5'
                : 'grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4';

            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-12 bg-white rounded-2xl border border-stone-200 p-6">
                        <p class="text-sm font-bold text-stone-600 mb-2">目前篩選條件下沒有符合的店家</p>
                        ${state.onlyOpenNow ? `<button type="button" onclick="toggleFilterOpenNow()" class="text-xs font-bold text-orange-600 underline">取消「僅看營業中」過濾</button>` : ''}
                    </div>
                `;
            } else {
                list.forEach((place, idx) => {
                    container.appendChild(createRestaurantCard(place, idx));
                });
            }

            // 更新分頁按鈕
            const pageBox = document.getElementById('pagination-container');
            pageBox.innerHTML = '';
            if (candidateCursor < candidatePlaces.length) {
                const moreBtn = document.createElement('button');
                moreBtn.type = 'button';
                moreBtn.className = 'bg-white hover:bg-orange-50 border border-stone-300 text-stone-700 font-bold px-8 py-3 rounded-full shadow-sm text-xs active:scale-95 transition-all';
                moreBtn.textContent = `載入更多好店 (已探索 ${candidateCursor}/${candidatePlaces.length})`;
                moreBtn.onclick = async () => {
                    moreBtn.textContent = '載入中...';
                    moreBtn.disabled = true;
                    await loadMoreDetailsBatch();
                };
                pageBox.appendChild(moreBtn);
            }
        }

        function createRestaurantCard(p, idx) {
            placeDataMap[p.place_id] = p;
            const isFav = isPlaceFavorited(p.place_id);
            const photoUrl = p.photos?.[0]?.getUrl({ maxWidth: 500, maxHeight: 360 }) || 'https://placehold.co/500x360/f5f5f4/a8a29e?text=美食探險家';

            let isOpen = undefined;
            try {
                if (p.opening_hours && typeof p.opening_hours.isOpen === 'function') {
                    isOpen = p.opening_hours.isOpen();
                }
            } catch (e) {}

            const statusBadge = isOpen === true
                ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800">營業中</span>`
                : (isOpen === false ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-stone-200 text-stone-600">休息中</span>` : '');

            const priceMap = ['', '$ 平價', '$$ 中價位', '$$$ 高價位', '$$$$ 奢華'];
            const priceBadge = p.price_level ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-stone-100 text-stone-700">${priceMap[p.price_level]}</span>` : '';

            // 行銷活動警示 (評分 > 4.8 且 評論數 > 1000)
            const hasMarketingAlert = p.rating > 4.8 && p.user_ratings_total > 1000;
            const marketingBadge = hasMarketingAlert
                ? `<span class="text-[11px] font-bold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 border border-amber-200" title="分數極高且評論破千，可能含有打卡送餐點活動">⚠️ 行銷熱店</span>`
                : '';

            const distBadge = p.distanceData
                ? `<span class="text-xs font-bold text-orange-700 bg-orange-50 border border-orange-200/60 px-2.5 py-0.5 rounded-lg flex items-center gap-1">
                    <span>${state.mode === 'walking' ? '🚶' : '🚗'}</span>${p.distanceData.text}
                   </span>`
                : '';

            // 日本 Tabelog 快速查驗按鈕
            const tabelogBtn = state.isJapan
                ? `<a href="https://tabelog.com/rstLst/?vs=1&sk=${encodeURIComponent(p.name)}" target="_blank" class="px-2.5 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 text-xs font-bold flex items-center gap-1">🍽️ Tabelog</a>`
                : '';

            const card = document.createElement('div');
            card.style.animationDelay = `${Math.min(idx * 40, 240)}ms`;

            // 緊湊清單模式
            if (state.compactView) {
                card.className = 'bg-white rounded-2xl p-3 shadow-xs border border-stone-200/80 flex gap-3 items-center card-enter';
                card.innerHTML = `
                    <a href="${p.url}" target="_blank" class="w-20 h-20 rounded-xl overflow-hidden flex-shrink-0 bg-stone-100 block">
                        <img src="${photoUrl}" class="w-full h-full object-cover" loading="lazy" alt="">
                    </a>
                    <div class="flex-grow min-w-0">
                        <div class="flex items-start justify-between gap-1">
                            <a href="${p.url}" target="_blank" class="text-sm font-black text-stone-900 truncate hover:text-orange-600">${p.name}</a>
                            <button type="button" onclick="toggleFavoriteById('${p.place_id}', this)" class="text-sm flex-shrink-0 px-1">${isFav ? '❤️' : '🤍'}</button>
                        </div>
                        <div class="flex flex-wrap items-center gap-1.5 mt-1">
                            <span class="text-xs font-extrabold text-amber-600 bg-amber-50 px-1.5 py-0.5 rounded">★ ${p.rating}</span>
                            <span class="text-xs text-stone-500">(${p.user_ratings_total})</span>
                            ${statusBadge}
                            ${marketingBadge}
                        </div>
                        <div class="flex items-center justify-between mt-2 pt-1.5 border-t border-stone-100">
                            ${distBadge || `<span class="text-xs text-stone-400 truncate">${p.formatted_address || ''}</span>`}
                            <div class="flex items-center gap-1.5">
                                ${tabelogBtn}
                                <button type="button" onclick="sharePlaceById('${p.place_id}')" class="px-2 py-1 rounded-lg bg-stone-100 text-stone-700 text-xs font-bold">分享</button>
                                <a href="${p.url}" target="_blank" class="px-2.5 py-1 rounded-lg bg-orange-600 text-white text-xs font-bold">導航</a>
                            </div>
                        </div>
                    </div>
                `;
                return card;
            }

            // 標準大圖卡片模式
            card.className = 'bg-white rounded-2xl shadow-xs border border-stone-200/80 overflow-hidden flex flex-col card-enter hover:shadow-md transition-shadow';
            card.innerHTML = `
                <div class="relative aspect-16/10 bg-stone-100 overflow-hidden">
                    <a href="${p.url}" target="_blank" class="block w-full h-full">
                        <img src="${photoUrl}" class="w-full h-full object-cover hover:scale-105 transition-transform duration-500" loading="lazy" alt="">
                    </a>
                    <div class="absolute top-2.5 left-2.5 flex flex-wrap gap-1.5">
                        ${statusBadge}
                        ${priceBadge}
                        ${marketingBadge}
                    </div>
                    <button type="button" onclick="toggleFavoriteById('${p.place_id}', this)" class="absolute top-2.5 right-2.5 w-8 h-8 rounded-full bg-white/90 backdrop-blur-xs shadow-sm flex items-center justify-center text-sm active:scale-90 transition-transform">
                        ${isFav ? '❤️' : '🤍'}
                    </button>
                </div>
                <div class="p-4 flex flex-col flex-grow">
                    <div class="flex justify-between items-start gap-2 mb-1">
                        <a href="${p.url}" target="_blank" class="text-base font-black text-stone-900 hover:text-orange-600 leading-snug line-clamp-1">${p.name}</a>
                        <div class="flex items-center gap-1 bg-amber-50 border border-amber-200/70 px-2 py-0.5 rounded-lg flex-shrink-0">
                            <span class="text-amber-500 text-xs">★</span>
                            <span class="text-stone-800 text-xs font-extrabold">${p.rating}</span>
                        </div>
                    </div>

                    <div class="flex items-center justify-between gap-2 mb-3">
                        <span class="text-xs font-medium text-stone-500">${(p.user_ratings_total || 0).toLocaleString()} 則評論</span>
                        ${distBadge}
                    </div>

                    <div class="mt-auto pt-3 border-t border-stone-100 space-y-2.5 text-xs text-stone-600">
                        <div class="flex items-center justify-between gap-2">
                            <span class="truncate text-stone-500">📍 ${p.formatted_address || ''}</span>
                            <button type="button" onclick="copyTextById('${p.place_id}')" class="text-stone-400 hover:text-stone-700 flex-shrink-0 font-bold">複製</button>
                        </div>

                        <div class="flex items-center justify-between gap-1.5 pt-1">
                            <div class="flex items-center gap-1.5">
                                ${p.formatted_phone_number ? `<a href="tel:${p.formatted_phone_number}" class="px-2.5 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold">📞 電話</a>` : ''}
                                <button type="button" onclick="sharePlaceById('${p.place_id}')" class="px-2.5 py-1.5 rounded-lg bg-stone-100 hover:bg-stone-200 text-stone-700 font-bold">💬 分享</button>
                                ${tabelogBtn}
                            </div>
                            <a href="${p.url}" target="_blank" class="px-3.5 py-1.5 rounded-xl bg-orange-600 hover:bg-orange-700 text-white font-bold shadow-xs">🗺️ Google 導航</a>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        // ==========================================
        // 8. 收藏夾、分享、隨機輪盤與輔助工具
        // ==========================================
        function isPlaceFavorited(placeId) {
            const favs = safeStorage.get('fe_favorites', []);
            return favs.some(f => f.place_id === placeId);
        }

        window.toggleFavoriteById = function(placeId, btnEl) {
            const place = placeDataMap[placeId];
            let favs = safeStorage.get('fe_favorites', []);
            const exists = favs.some(f => f.place_id === placeId);

            if (exists) {
                favs = favs.filter(f => f.place_id !== placeId);
                if (btnEl) btnEl.textContent = '🤍';
                showToast('已從收藏移除');
            } else if (place) {
                const simplified = {
                    place_id: place.place_id,
                    name: place.name,
                    rating: place.rating,
                    user_ratings_total: place.user_ratings_total,
                    formatted_address: place.formatted_address,
                    formatted_phone_number: place.formatted_phone_number,
                    url: place.url,
                    price_level: place.price_level,
                    photoUrl: place.photos?.[0]?.getUrl({ maxWidth: 500, maxHeight: 360 }) || ''
                };
                favs.unshift(simplified);
                if (btnEl) btnEl.textContent = '❤️';
                showToast('❤️ 已加入口袋收藏！');
            }
            safeStorage.set('fe_favorites', favs);
            updateFavBadge();
            if (state.activeTab === 'favorites') renderFavoritesList();
        };

        function updateFavBadge() {
            const favs = safeStorage.get('fe_favorites', []);
            const badge = document.getElementById('fav-count-badge');
            if (badge) badge.textContent = favs.length;
        }

        window.switchTab = function(tab) {
            state.activeTab = tab;
            const exploreSec = document.getElementById('explore-section');
            const favSec = document.getElementById('favorites-section');
            const filterBar = document.getElementById('secondary-filter-bar');

            if (tab === 'favorites') {
                exploreSec.classList.add('hidden');
                filterBar.classList.add('hidden');
                favSec.classList.remove('hidden');
                renderFavoritesList();
            } else {
                favSec.classList.add('hidden');
                exploreSec.classList.remove('hidden');
                if (loadedDetailedPlaces.length > 0) filterBar.classList.remove('hidden');
            }
        };

        function renderFavoritesList() {
            const container = document.getElementById('favorites-container');
            const favs = safeStorage.get('fe_favorites', []);
            container.innerHTML = '';

            if (favs.length === 0) {
                container.innerHTML = `
                    <div class="col-span-full text-center py-16 bg-white rounded-3xl border border-stone-200 p-6">
                        <div class="text-3xl mb-2">🤍</div>
                        <p class="text-sm font-bold text-stone-700 mb-1">尚未收藏任何餐廳</p>
                        <p class="text-xs text-stone-400">在搜尋結果點擊卡片右上角的愛心，即可隨時保存口袋名單！</p>
                    </div>
                `;
                return;
            }

            favs.forEach((f, idx) => {
                placeDataMap[f.place_id] = f;
                const mockPlace = {
                    ...f,
                    photos: f.photoUrl ? [{ getUrl: () => f.photoUrl }] : []
                };
                container.appendChild(createRestaurantCard(mockPlace, idx));
            });
        }

        window.copyTextById = function(placeId) {
            const p = placeDataMap[placeId];
            if (!p) return;
            const text = `${p.name} - ${p.formatted_address || ''}`;
            if (navigator.clipboard) {
                navigator.clipboard.writeText(text).then(() => showToast('📋 已複製店名與地址'));
            } else {
                showToast('📋 ' + text);
            }
        };

        window.sharePlaceById = function(placeId) {
            const p = placeDataMap[placeId];
            if (!p) return;
            const shareText = `🍽️ ${p.name} (★${p.rating} / ${p.user_ratings_total}則評論)\n📍 ${p.formatted_address || ''}\n🗺️ ${p.url}`;
            if (navigator.share) {
                navigator.share({ title: p.name, text: shareText, url: p.url }).catch(() => {});
            } else if (navigator.clipboard) {
                navigator.clipboard.writeText(shareText).then(() => showToast('💬 已複製餐廳資訊，可直接貼上 LINE 分享！'));
            }
        };

        // 隨機選店輪盤
        window.openRoulette = function() {
            if (loadedDetailedPlaces.length === 0) {
                showToast('請先搜尋餐廳後再使用抽籤功能');
                return;
            }
            document.getElementById('roulette-modal').classList.remove('hidden');
            spinRoulette();
        };

        window.closeRoulette = function() {
            document.getElementById('roulette-modal').classList.add('hidden');
        };

        window.spinRoulette = function() {
            if (loadedDetailedPlaces.length === 0) return;
            const pick = loadedDetailedPlaces[Math.floor(Math.random() * loadedDetailedPlaces.length)];
            const box = document.getElementById('roulette-result-box');
            const navLink = document.getElementById('roulette-nav-link');
            box.innerHTML = `
                <div class="font-black text-base text-stone-900 mb-1">${pick.name}</div>
                <div class="text-xs font-bold text-amber-600 mb-1">★ ${pick.rating} (${pick.user_ratings_total} 則評論)</div>
                <div class="text-xs text-stone-500 truncate">📍 ${pick.formatted_address || ''}</div>
            `;
            navLink.href = pick.url || '#';
        };

        // ==========================================
        // 9. API 快取封裝函式
        // ==========================================
        function geocodeAddress(address) {
            if (geocodeCache[address]) return Promise.resolve(geocodeCache[address]);
            return new Promise((resolve, reject) => {
                geocoder.geocode({ address }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        const isJapan = results[0].address_components.some(c => c.short_name === 'JP');
                        const data = { location: results[0].geometry.location, isJapan };
                        geocodeCache[address] = data;
                        resolve(data);
                    } else {
                        reject(new Error('找不到「' + address + '」這個地區，請嘗試輸入更明確的行政區'));
                    }
                });
            });
        }

        function reverseGeocode(latLng) {
            return new Promise((resolve, reject) => {
                geocoder.geocode({ location: latLng }, (results, status) => {
                    if (status === 'OK' && results[0]) resolve(results[0]);
                    else reject(status);
                });
            });
        }

        function getPlaceDetailsCached(placeId) {
            if (detailsCache[placeId]) return Promise.resolve(detailsCache[placeId]);
            return new Promise(resolve => {
                placesService.getDetails({
                    placeId,
                    fields: ['name', 'rating', 'user_ratings_total', 'formatted_address', 'photos', 'place_id', 'opening_hours', 'url', 'price_level', 'geometry', 'types', 'formatted_phone_number']
                }, (detail, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK && detail) {
                        detailsCache[placeId] = detail;
                        resolve(detail);
                    } else {
                        resolve(null);
                    }
                });
            });
        }

        function getWalkingRouteCached(origin, destination, placeId) {
            if (routeCache[placeId]) return Promise.resolve(routeCache[placeId]);
            return new Promise(resolve => {
                directionsService.route({
                    origin,
                    destination,
                    travelMode: 'WALKING'
                }, (result, status) => {
                    if (status === 'OK' && result.routes[0]?.legs[0]) {
                        const leg = result.routes[0].legs[0];
                        const data = { text: `${leg.distance.text}・${leg.duration.text}`, value: leg.duration.value };
                        routeCache[placeId] = data;
                        resolve(data);
                    } else {
                        resolve(null);
                    }
                });
            });
        }

        function showLoadingSkeleton() {
            const container = document.getElementById('results-container');
            container.innerHTML = Array(6).fill(0).map(() => `
                <div class="bg-white rounded-2xl border border-stone-200 overflow-hidden h-72 animate-pulse flex flex-col">
                    <div class="bg-stone-200 h-40 w-full"></div>
                    <div class="p-4 space-y-3 flex-grow">
                        <div class="h-4 bg-stone-200 rounded w-3/4"></div>
                        <div class="h-3 bg-stone-200 rounded w-1/2"></div>
                        <div class="h-8 bg-stone-100 rounded-xl w-full mt-auto"></div>
                    </div>
                </div>
            `).join('');
        }

        // 滾動控制與回到頂部
        window.scrollToTop = function() {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.addEventListener('scroll', () => {
            const topBtn = document.getElementById('back-to-top-btn');
            if (topBtn) {
                topBtn.classList.toggle('hidden', window.scrollY <= 320);
            }
        }, { passive: true });

        // 監聽手動搜尋框輸入變化以顯示清除鈕
        document.addEventListener('DOMContentLoaded', () => {
            const input = document.getElementById('custom-cuisine-input');
            const clearBtn = document.getElementById('clear-cuisine-btn');
            if (input && clearBtn) {
                input.addEventListener('input', () => {
                    clearBtn.classList.toggle('hidden', !input.value.trim());
                });
            }
        });
    </script>

    <!-- 載入 Google Maps JS API -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB-Ev8iMdRHstXwwFL2L6JpghYzgGsbiqY&libraries=places,geometry&callback=initMap&language=zh-TW" async defer></script>
