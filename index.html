<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">

    <!-- PWA & Mobile Web Capabilities -->
    <link id="manifest-link" rel="manifest">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="美食探險家">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/ea580c/ffffff?text=食">

    <!-- Fonts & Tailwind CSS (v3.4 CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ea580c;
            --primary-light: #f97316;
            --primary-surface: #fff7ed;
            --bg-canvas: #fafaf9;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-canvas);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }

        /* 隱藏滾動條與原生搜尋框取消鈕 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        input[type="search"]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }

        /* 卡片進場動態效果 */
        @keyframes subtle-fade-slide {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card {
            animation: subtle-fade-slide 0.32s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* 觸控微反饋 */
        .tap-active:active {
            transform: scale(0.96);
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 愛心收藏彈跳效果 */
        @keyframes heart-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: heart-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 骨架屏光暈 Shimmer 動態 */
        @keyframes shimmer-move {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-shimmer {
            background: linear-gradient(90deg, #f5f5f4 25%, #e7e5e4 50%, #f5f5f4 75%);
            background-size: 200% 100%;
            animation: shimmer-move 1.6s infinite ease-in-out;
        }

        /* 頂部 Header 滾動收折過渡 */
        #collapsible-controls {
            transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s ease, transform 0.25s ease;
            max-height: 380px;
            opacity: 1;
            transform: translateY(0);
            overflow: hidden;
        }
        #collapsible-controls.collapsed {
            max-height: 0;
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
        }

        /* 收折狀態下的迷你狀態膠囊條 */
        #collapsed-pill-bar {
            transition: max-height 0.25s ease, opacity 0.2s ease;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        #collapsed-pill-bar.active {
            max-height: 48px;
            opacity: 1;
        }

        /* Bottom Sheet 抽屜動態 */
        .sheet-backdrop {
            transition: opacity 0.28s ease;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }
        .sheet-panel {
            transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.25, 1);
            transform: translateY(100%);
            max-height: 88vh;
        }
        .sheet-panel.active {
            transform: translateY(0);
        }

        body.prevent-scroll {
            overflow: hidden;
            touch-action: none;
        }
    </style>
</head>
<body class="text-stone-800 antialiased selection:bg-orange-100 selection:text-orange-800">

    <!-- 頂部主面板與全域篩選 -->

            <!-- 品牌列與動作按鈕 -->

                <div class="flex items-center gap-2">
                    <button id="favorites-toggle-btn" class="tap-active flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-stone-100 text-stone-700 hover:bg-stone-200/80 transition-colors">
                        <span id="fav-icon" class="text-rose-500">❤️</span>
                        <span>收藏 (<span id="fav-count">0</span>)</span>
                    </button>
                    
                    <button id="search-trigger-btn" class="tap-active flex items-center gap-1.5 bg-orange-50 border border-orange-200/80 text-orange-700 px-3 py-1.5 rounded-full text-xs font-bold hover:bg-orange-100 transition-colors">
                        <span id="search-bar-label" class="truncate max-w-[110px] sm:max-w-[170px]">地點設定</span>
                        <svg class="w-3.5 h-3.5 opacity-75" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" /></svg>
                    </button>
                </div>
            </div>

            <!-- 收折時出現的極窄狀態膠囊條 -->
            <div id="collapsed-pill-bar" class="flex items-center justify-between pb-1 pt-0.5">
                <button onclick="expandControlsHeader(true)" class="tap-active flex items-center gap-2 text-xs font-bold text-orange-700 bg-orange-50/90 border border-orange-200/90 px-3.5 py-1.5 rounded-full shadow-sm">
                    <span id="collapsed-summary-text">📍 附近 · 🍽️ 全部 · 🚶 步行</span>
                    <svg class="w-3.5 h-3.5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" /></svg>
                </button>
                <div class="flex items-center gap-1.5 text-xs text-stone-500 font-semibold">
                    <button onclick="expandAndFocusFoodInput()" class="tap-active flex items-center gap-1 px-2.5 py-1 rounded-full bg-stone-100 text-stone-700 font-bold">
                        <span>🔍</span>
                        <span>搜食物</span>
                    </button>
                    <button onclick="triggerRandomPick()" class="tap-active flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200/80 font-bold">
                        <span>🎲</span>
                        <span>幫我選</span>
                    </button>

            </div>

            <!-- 可收折區域：交通方式切換器 + 手動搜尋框 + 美食標籤雲 -->
            <div id="collapsible-controls">
                
                <!-- 交通方式切換器 -->
                <div class="grid grid-cols-2 gap-2 bg-stone-100 p-1 rounded-xl mb-2">

                        <span>🚶</span>
                        <span>步行 (10分可達)</span>

                    <button id="mode-drive-btn" onclick="switchTransportMode('driving')" class="tap-active py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900 transition-all">
                        <span>🚗</span>
                        <span>開車 (5公里範圍)</span>
                    </button>
                </div>

                <!-- 手動搜尋食物種類 / 店名輸入框 -->
                <form onsubmit="handleCustomCuisineSubmit(event)" class="relative flex items-center gap-1.5 mb-2">
                    <div class="relative flex-1">
                        <span class="absolute left-3 top-1/2 -translate-y-1/2 text-stone-400 text-xs pointer-events-none">🔍</span>
                        <input
                            id="custom-cuisine-input"
                            type="search"
                            enterkeyhint="search"
                            oninput="toggleClearCuisineBtn()"
                            placeholder="輸入想吃的食物或店名 (例：拉麵、燒肉、酸菜魚、滷肉飯)..."
                            class="w-full bg-stone-100/90 focus:bg-white border border-stone-200/90 focus:border-orange-500 rounded-xl pl-8 pr-8 py-2 text-xs font-medium text-stone-800 placeholder:text-stone-400 outline-none focus:ring-2 focus:ring-orange-500/20 transition-all"
                        >
                        <button
                            id="clear-cuisine-btn"
                            type="button"
                            onclick="clearCustomCuisineInput()"
                            class="hidden absolute right-2.5 top-1/2 -translate-y-1/2 w-5 h-5 rounded-full bg-stone-300/80 text-stone-600 hover:bg-stone-400 hover:text-white flex items-center justify-center text-xs font-bold transition-colors"
                            title="清除關鍵字"
                        >✕</button>
                    </div>
                    <button type="submit" class="tap-active px-3.5 py-2 bg-stone-900 hover:bg-orange-600 text-white rounded-xl text-xs font-bold shadow-sm transition-colors flex-shrink-0">
                        搜尋
                    </button>
                </form>

                <!-- 智慧兩段式標籤雲 (預設常用 + 動態自訂標籤 + 展開更多) -->
                <div class="flex flex-wrap gap-1.5 justify-start items-center">
                    <!-- 全部美食 -->
                    <button onclick="handleQuickSelect('')" data-cuisine="" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-orange-600 text-white shadow-sm">
                        🍽️ 全部美食
                    </button>

                    <!-- 動態自訂搜尋活躍標籤 (當使用者輸入非預設標籤時自動浮現) -->
                    <button id="custom-active-tag" onclick="handleQuickSelect('')" class="hidden tap-active px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-orange-600 text-white shadow-sm flex items-center gap-1.5">
                        <span id="custom-active-tag-text">🔍 自訂美食</span>
                        <span class="text-orange-200 hover:text-white font-black">✕</span>
                    </button>

                    <!-- 最近手動搜尋過的食物標籤容器 -->

                    <!-- 首屏常駐熱門標籤 -->
                    <button onclick="handleQuickSelect('牛肉麵')" data-cuisine="牛肉麵" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🍜 牛肉麵
                    </button>
                    <button onclick="handleQuickSelect('火鍋')" data-cuisine="火鍋" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🍲 火鍋
                    </button>
                    <button onclick="handleQuickSelect('日式料理')" data-cuisine="日式料理" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🍣 日式料理
                    </button>
                    <button onclick="handleQuickSelect('韓式料理')" data-cuisine="韓式料理" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🥘 韓式料理
                    </button>
                    <button onclick="handleQuickSelect('咖啡廳')" data-cuisine="咖啡廳" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        ☕ 咖啡廳
                    </button>
                    <button onclick="handleQuickSelect('早午餐')" data-cuisine="早午餐" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🥞 早午餐
                    </button>

                    <!-- 第二段隱藏標籤群 (點擊後平滑展開) -->
                    <div id="more-tags-tray" class="contents hidden">
                        <button onclick="handleQuickSelect('拉麵')" data-cuisine="拉麵" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🍥 拉麵
                        </button>
                        <button onclick="handleQuickSelect('燒肉')" data-cuisine="燒肉" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🥩 燒肉
                        </button>
                        <button onclick="handleQuickSelect('義大利麵')" data-cuisine="義大利麵" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🍝 義大利麵
                        </button>
                        <button onclick="handleQuickSelect('小吃')" data-cuisine="小吃" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🥟 在地小吃
                        </button>
                        <button onclick="handleQuickSelect('甜點')" data-cuisine="甜點" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🍰 精緻甜點
                        </button>
                        <button onclick="handleQuickSelect('美式漢堡')" data-cuisine="美式漢堡" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">

                        </button>

                            🍶 居酒屋
                        </button>
                        <button onclick="handleQuickSelect('麵包店')" data-cuisine="麵包店" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto px-4 pt-3.5 pb-20 min-h-[78vh]">
        
        <!-- 全域狀態/錯誤通知欄 -->
        <div id="status-toast-bar" class="hidden mb-3 p-3 rounded-xl text-xs font-semibold text-center border transition-all"></div>

        <!-- 搜尋結果控制面板：統計、多維度排序與零延遲二次快篩 -->
        <div id="results-meta-header" class="hidden mb-3.5 space-y-2.5">
            <!-- 第一排：店家數量 + 大圖/清單切換 -->

                <div class="flex items-center bg-stone-100 p-0.5 rounded-lg border border-stone-200/70 flex-shrink-0">

                        <span>大圖</span>
                    </button>
                    <button id="view-compact-btn" onclick="switchViewMode('compact')" class="tap-active px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 flex items-center gap-1">
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                        <span>清單</span>
                    </button>
                </div>
            </div>

            <!-- 第二排：老饕三段排序 + 零延遲「營業中 / 價位」即時過濾列 -->
            <div id="secondary-filter-bar" class="flex flex-wrap items-center justify-between gap-2 bg-white p-2 rounded-xl border border-stone-200/80 shadow-sm">
                <!-- 排序方式切換 -->

                    </button>
                    <button onclick="changeSortBy('reviews')" data-sort="reviews" class="sort-btn tap-active px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 hover:text-stone-900 transition-all">
                        🔥 人氣評論
                    </button>
                    <button onclick="changeSortBy('distance')" data-sort="distance" class="sort-btn tap-active px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 hover:text-stone-900 transition-all">
                        📍 距離最近
                    </button>
                </div>

                <!-- 即時二次快篩：營業中 & 價位 -->
                <div class="flex items-center gap-1.5 flex-wrap">
                    <button id="filter-open-btn" onclick="toggleOpenNowFilter()" class="tap-active px-2.5 py-1 rounded-lg text-xs font-semibold border border-stone-200 bg-stone-50 text-stone-600 flex items-center gap-1 transition-all">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span>僅看營業中</span>
                    </button>

                    <select id="filter-price-select" onchange="changePriceFilter(this.value)" class="bg-stone-50 border border-stone-200 text-stone-700 text-xs font-semibold rounded-lg px-2 py-1 outline-none focus:border-orange-400">
                        <option value="all">💰 全部價位</option>
                        <option value="budget">🪙 銅板平價 ($~$$)</option>
                        <option value="fancy">🥂 聚餐精緻 ($$$+)</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- 結果卡片容器 (依 viewMode 動態變更 grid 樣式) -->
        <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
            <!-- 初始啟動引導面板 -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-center">
                <div class="w-16 h-16 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center text-3xl mb-3 shadow-sm border border-orange-100">
                    🧭
                </div>
                <h3 class="text-base font-bold text-stone-900 mb-1">發現身邊隱藏的神級美食</h3>
                <p class="text-xs text-stone-500 max-w-xs mb-4">支援上方手動輸入任何想吃的食物或店名，並透過老饕貝氏加權評分演算法自動過濾灌水店。</p>

    <!-- 浮動 Toast 提示 -->
    <div id="toast-notify" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-2">
        <div class="bg-stone-900/95 backdrop-blur-md text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
            <span id="toast-icon">ℹ️</span>
            <span id="toast-text">提示訊息</span>
        </div>
    </div>

    <script>
        /* ==========================================================================
           全域應用程式狀態 (含快取、老饕排序、自訂食物搜尋紀錄與二次快篩狀態)
           ========================================================================== */
        const PRESET_CUISINES = [
            '', '牛肉麵', '火鍋', '日式料理', '韓式料理', '咖啡廳', '早午餐',
            '拉麵', '燒肉', '義大利麵', '小吃', '甜點', '美式漢堡', '泰式料理', '居酒屋', '麵包店', '素食'
        ];

        const AppState = {
            area: 'current_location',
            areaName: '📍 目前位置附近',
            cuisine: '',
            cuisineName: '所有美食',
            transportMode: 'walking', // 'walking' | 'driving'
            displayMode: localStorage.getItem('food_explorer_view_mode') || 'magazine', // 'magazine' | 'compact'
            sortBy: 'gourmet', // 'gourmet' (貝氏加權) | 'reviews' (評論數) | 'distance' (距離最近)
            onlyOpenNow: false,
            priceFilter: 'all', // 'all' | 'budget' | 'fancy'
            isJapanRegion: false,
            userLocation: null,
            searchCenterLocation: null,
            allRawPlaces: [],
            enrichedPlaces: [], // 已通過路線與詳情驗證的餐廳清單
            renderedCount: 0,
            batchSize: 16,
            isLoading: false,
            viewMode: 'explore', // 'explore' | 'favorites'
            favorites: JSON.parse(localStorage.getItem('food_explorer_favorites') || '[]'),
            recentSearches: JSON.parse(localStorage.getItem('food_explorer_recent_searches') || '[]'),
            recentCuisines: JSON.parse(localStorage.getItem('food_explorer_recent_cuisines') || '[]'),
            detailsCache: new Map(),
            routeCache: new Map(),
            geocodeCache: new Map()
        };

        // Google Maps 服務實例
        let placesService = null;
        let directionsService = null;
        let geocoder = null;

        // HTML 安全跳脫輔助函式 (防止單引號或特殊字元截斷)
        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // 依 placeId 安全查找餐廳物件
        function findPlaceById(placeId) {
            return (
                AppState.enrichedPlaces.find(p => p.place_id === placeId) ||
                AppState.allRawPlaces.find(p => p.place_id === placeId) ||
                AppState.favorites.find(p => p.place_id === placeId) ||
                AppState.detailsCache.get(placeId)
            );
        }

        // 老饕貝氏加權評分演算法 (Bayesian Average)
        function computeGourmetScore(place, isJapan) {
            const R = place.rating || 0;
            const v = place.user_ratings_total || 0;
            const m = 150; // 信賴評論數門檻
            const C = isJapan ? 3.65 : 4.10; // 區域基準平均分
            let score = (v / (v + m)) * R + (m / (v + m)) * C;

            // 若非日本地區且觸發「高分破千則打卡行銷疑慮」，進行微幅權重校正，避免壓過真實私房名店
            if (!isJapan && R > 4.8 && v > 1000) {
                score -= 0.12;
            }
            return score;
        }

        // PWA 離線清單初始化
        (function setupManifest() {
            const manifestObj = {
                name: "美食探險家",
                short_name: "美食探險",
                start_url: ".",
                display: "standalone",
                background_color: "#fafaf9",
                theme_color: "#ea580c",
                icons: [
                    { src: "https://placehold.co/192x192/ea580c/ffffff?text=食", sizes: "192x192", type: "image/png" },
                    { src: "https://placehold.co/512x512/ea580c/ffffff?text=食", sizes: "512x512", type: "image/png" }
                ]
            };
            const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
            document.getElementById('manifest-link').href = URL.createObjectURL(blob);
        })();

        /* ==========================================================================
           Google 地圖服務初始化
           ========================================================================== */
        window.initMap = function() {
            try {
                const hiddenNode = document.createElement('div');
                const fallbackCenter = { lat: 25.033964, lng: 121.564468 };
                const mapInstance = new google.maps.Map(hiddenNode, { center: fallbackCenter, zoom: 14 });
                
                placesService = new google.maps.places.PlacesService(mapInstance);
                directionsService = new google.maps.DirectionsService();
                geocoder = new google.maps.Geocoder();
                
                updateFavoritesCountUI();
                renderRecentSearches();
                renderRecentCuisineChips();
                initViewModeUI();
                console.log("[FoodExplorer] 老饕演算法與自訂美食搜尋引擎已就緒");
                
                acquireUserLocation(true).catch(() => {});
            } catch (err) {
                console.error("[FoodExplorer] 地圖初始化失敗:", err);
                showToastNotification("地圖元件加載失敗，請確認 API Key 授權", "error");
            }
        };

        function acquireUserLocation(silent = false) {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    if (!silent) showToastNotification("裝置不支援定位功能", "warning");
                    return reject(new Error("不支援 Geolocation"));
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        AppState.userLocation = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude
                        };
                        resolve(AppState.userLocation);
                    },
                    (err) => {
                        AppState.userLocation = null;
                        if (!silent) {
                            if (err.code === err.PERMISSION_DENIED) {
                                showToastNotification("未允許定位授權，請點選右上角手動設定地區", "warning");
                            } else {
                                showToastNotification("定位逾時，請手動選取商圈", "warning");
                            }
                        }
                        reject(err);
                    },
                    { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 }
                );
            });
        }

        /* ==========================================================================
           頂部 Header 滾動收折機制
           ========================================================================== */
        let lastScrollPosition = 0;
        let isHeaderCollapsed = false;
        const collapsibleControls = document.getElementById('collapsible-controls');
        const collapsedPillBar = document.getElementById('collapsed-pill-bar');
        const floatingTopBtn = document.getElementById('floating-top-btn');
        const floatingRandomBtn = document.getElementById('floating-random-btn');

        window.addEventListener('scroll', () => {
            const currentY = window.scrollY;
            
            if (currentY > 280) {
                floatingTopBtn.classList.remove('hidden');
                if (AppState.enrichedPlaces.length > 0) floatingRandomBtn.classList.remove('hidden');
            } else {
                floatingTopBtn.classList.add('hidden');
                floatingRandomBtn.classList.add('hidden');
            }

            // 當使用者正在輸入框打字時，不自動收折頂部面板
            if (document.activeElement && document.activeElement.id === 'custom-cuisine-input') {
                return;
            }

            if (currentY > 95 && currentY > lastScrollPosition) {
                if (!isHeaderCollapsed) collapseControlsHeader();
            } else if (currentY < lastScrollPosition - 15 || currentY <= 30) {
                if (isHeaderCollapsed) expandControlsHeader();
            }

            lastScrollPosition = Math.max(0, currentY);
        }, { passive: true });

        function collapseControlsHeader() {
            isHeaderCollapsed = true;
            collapsibleControls.classList.add('collapsed');
            collapsedPillBar.classList.add('active');
            updateCollapsedPillText();
        }

        window.expandControlsHeader = function() {
            isHeaderCollapsed = false;
            collapsibleControls.classList.remove('collapsed');
            collapsedPillBar.classList.remove('active');
        };

        window.expandAndFocusFoodInput = function() {
            expandControlsHeader();
            setTimeout(() => {
                const inputEl = document.getElementById('custom-cuisine-input');
                if (inputEl) inputEl.focus();
            }, 150);
        };

        function updateCollapsedPillText() {
            const areaShort = AppState.areaName.replace('📍 ', '').replace('🇯🇵 ', '');
            const cuisineShort = AppState.cuisineName || '全部';
            const modeIcon = AppState.transportMode === 'walking' ? '🚶 步行' : '🚗 開車';
            document.getElementById('collapsed-summary-text').textContent = `📍 ${areaShort} · 🍽️ ${cuisineShort} · ${modeIcon}`;
        }

        window.toggleMoreTags = function() {
            const tray = document.getElementById('more-tags-tray');
            const btn = document.getElementById('toggle-more-tags-btn');
            if (tray.classList.contains('hidden')) {
                tray.classList.remove('hidden');
                btn.innerHTML = '<span>收起 ▲</span>';
            } else {
                tray.classList.add('hidden');
                btn.innerHTML = '<span>＋更多種類</span>';
            }
        };

        /* ==========================================================================
           手動搜尋食物種類 / 店名功能 (Custom Cuisine Search & History)
           ========================================================================== */
        window.toggleClearCuisineBtn = function() {
            const inputEl = document.getElementById('custom-cuisine-input');
            const clearBtn = document.getElementById('clear-cuisine-btn');
            if (inputEl.value.trim().length > 0) {
                clearBtn.classList.remove('hidden');
            } else {
                clearBtn.classList.add('hidden');
            }
        };

        window.clearCustomCuisineInput = function() {
            const inputEl = document.getElementById('custom-cuisine-input');
            inputEl.value = '';
            toggleClearCuisineBtn();
            if (AppState.cuisine !== '') {
                handleQuickSelect('');
            } else {
                inputEl.focus();
            }
        };

        window.handleCustomCuisineSubmit = function(event) {
            if (event) event.preventDefault();
            const inputEl = document.getElementById('custom-cuisine-input');
            const val = inputEl.value.trim();
            inputEl.blur(); // 自動收起手機虛擬鍵盤，直接呈現搜尋結果

            if (!val) {
                handleQuickSelect('');
                return;
            }

            // 若為非預設標籤的自訂食物，存入最近自訂美食紀錄
            if (!PRESET_CUISINES.includes(val)) {
                saveRecentCuisine(val);
            }

            handleQuickSelect(val);
        };

        function saveRecentCuisine(keyword) {
            AppState.recentCuisines = AppState.recentCuisines.filter(item => item !== keyword);
            AppState.recentCuisines.unshift(keyword);
            if (AppState.recentCuisines.length > 4) {
                AppState.recentCuisines.pop();
            }
            localStorage.setItem('food_explorer_recent_cuisines', JSON.stringify(AppState.recentCuisines));
            renderRecentCuisineChips();
        }

        window.removeRecentCuisine = function(keyword, event) {
            if (event) event.stopPropagation();
            AppState.recentCuisines = AppState.recentCuisines.filter(item => item !== keyword);
            localStorage.setItem('food_explorer_recent_cuisines', JSON.stringify(AppState.recentCuisines));
            renderRecentCuisineChips();
            if (AppState.cuisine === keyword) {
                handleQuickSelect('');
            }
        };

        function renderRecentCuisineChips() {
            const container = document.getElementById('recent-cuisine-tags');
            if (!container) return;
            container.innerHTML = '';

            AppState.recentCuisines.forEach(item => {
                // 若當前正選中該自訂標籤，已由 #custom-active-tag 顯示，避免重複
                if (AppState.cuisine === item && !PRESET_CUISINES.includes(item)) return;

                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = "tap-active px-2.5 py-1.5 rounded-lg text-xs font-semibold text-amber-900 bg-amber-50 hover:bg-amber-100 border border-amber-200/80 flex items-center gap-1 transition-all";
                btn.innerHTML = `
                    <span>🕒 ${escapeHtml(item)}</span>
                    <span class="text-amber-400 hover:text-amber-800 pl-0.5" title="移除紀錄">×</span>
                `;
                btn.onclick = (e) => {
                    if (e.target.textContent === '×') {
                        removeRecentCuisine(item, e);
                    } else {
                        handleQuickSelect(item);
                    }
                };
                container.appendChild(btn);
            });
        }

        /* ==========================================================================
           多維度排序與零延遲二次快篩 (老饕推薦 / 評論數 / 距離 + 營業中 / 價位)
           ========================================================================== */
        window.changeSortBy = async function(sortMode) {
            if (AppState.sortBy === sortMode) return;
            AppState.sortBy = sortMode;

            document.querySelectorAll('.sort-btn').forEach(btn => {
                if (btn.getAttribute('data-sort') === sortMode) {
                    btn.className = "sort-btn tap-active px-2.5 py-1 rounded-md text-xs font-bold bg-white text-orange-600 shadow-sm transition-all";
                } else {
                    btn.className = "sort-btn tap-active px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 hover:text-stone-900 transition-all";
                }
            });

            if (AppState.viewMode === 'explore' && AppState.allRawPlaces.length > 0) {
                sortRawCandidates();
                AppState.renderedCount = 0;
                AppState.enrichedPlaces = [];
                await renderCardsBatch(true);
            }
        };

        function sortRawCandidates() {
            if (AppState.sortBy === 'gourmet') {
                AppState.allRawPlaces.sort((a, b) => (b.gourmetScore || 0) - (a.gourmetScore || 0));
            } else if (AppState.sortBy === 'reviews') {
                AppState.allRawPlaces.sort((a, b) => (b.user_ratings_total || 0) - (a.user_ratings_total || 0));
            } else if (AppState.sortBy === 'distance') {
                AppState.allRawPlaces.sort((a, b) => (a.linearDistanceMeters || 999999) - (b.linearDistanceMeters || 999999));
            }
        }

        window.toggleOpenNowFilter = function() {
            AppState.onlyOpenNow = !AppState.onlyOpenNow;
            const btn = document.getElementById('filter-open-btn');
            if (AppState.onlyOpenNow) {

        window.changePriceFilter = function(val) {
            AppState.priceFilter = val;
            applyClientFiltersAndRender();

        function getFilteredEnrichedPlaces() {
            return AppState.enrichedPlaces.filter(p => {
                // 營業中過濾
                if (AppState.onlyOpenNow) {
                    const isOpen = getPlaceOpenStatus(p);
                    if (isOpen !== true) return false;
                }
                // 價位過濾
                if (AppState.priceFilter === 'budget') {
                    if (p.price_level && p.price_level > 2) return false;
                } else if (AppState.priceFilter === 'fancy') {
                    if (!p.price_level || p.price_level < 3) return false;
                }
                return true;
            });
        }

        function getPlaceOpenStatus(p) {
            if (!p.opening_hours) return undefined;
            if (typeof p.opening_hours.isOpen === 'function') {
                try { return p.opening_hours.isOpen(); } catch (e) {}
            }
            if (typeof p.opening_hours.open_now === 'boolean') {
                return p.opening_hours.open_now;
            }
            return undefined;
        }

        /* ==========================================================================
           使用者反饋、安全複製地址與原生分享 (支援單引號店名與 LINE 分享)
           ========================================================================== */
        let toastTimeout = null;
        function showToastNotification(message, type = 'info') {
            const toastEl = document.getElementById('toast-notify');
            const iconEl = document.getElementById('toast-icon');
            const textEl = document.getElementById('toast-text');
            
            const icons = {
                info: '💡',
                success: '✅',
                warning: '⚠️',
                error: '❌',
                heart: '❤️'
            };

            iconEl.textContent = icons[type] || '💡';
            textEl.textContent = message;

            toastEl.classList.remove('opacity-0', '-translate-y-2');
            toastEl.classList.add('opacity-100', 'translate-y-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('opacity-100', 'translate-y-0');
                toastEl.classList.add('opacity-0', '-translate-y-2');
            }, 2800);
        }

        function copyTextSilently(text, successMsg) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(() => {
                    showToastNotification(successMsg, "success");
                }).catch(() => fallbackCopyText(text, successMsg));
            } else {
                fallbackCopyText(text, successMsg);
            }
        }

        function fallbackCopyText(text, successMsg) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToastNotification(successMsg, "success");
            } catch (err) {
                showToastNotification("複製失敗，請手動複製", "warning");
            }
            document.body.removeChild(textarea);
        }

        window.handleCopyAddress = function(placeId, event) {
            if (event) event.stopPropagation();
            const target = findPlaceById(placeId);
            if (!target) return;
            const addr = target.formatted_address || target.vicinity || target.name;
            copyTextSilently(addr, "已複製店家地址到剪貼簿");
        };

        window.handleSharePlace = async function(placeId, event) {
            if (event) event.stopPropagation();
            const target = findPlaceById(placeId);
            if (!target) return;

            const mapLink = target.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target.name)}&query_place_id=${target.place_id}`;
            const addr = target.formatted_address || target.vicinity || '';
            const shareText = `🍽️ ${target.name} (★${target.rating || '–'} · ${target.user_ratings_total || 0}則評論)\n📍 ${addr}`;

            if (navigator.share) {
                try {
                    await navigator.share({
                        title: `美食推薦：${target.name}`,
                        text: shareText,
                        url: mapLink
                    });
                    return;
                } catch (err) {
                    if (err.name === 'AbortError') return;
                }
            }
            copyTextSilently(`${shareText}\n🗺️ ${mapLink}`, "已複製餐廳資訊與連結，可直接貼上 LINE 分享！");
        };

        /* ==========================================================================

        window.toggleFavorite = function(placeId, event) {
            if (event) event.stopPropagation();
            
            const heartBtn = document.querySelector(`[data-fav-btn="${placeId}"]`);
            if (heartBtn) {
                heartBtn.classList.add('animate-pop');
                setTimeout(() => heartBtn.classList.remove('animate-pop'), 350);
            }

            const existingIndex = AppState.favorites.findIndex(item => item.place_id === placeId);
            if (existingIndex >= 0) {
                AppState.favorites.splice(existingIndex, 1);
                showToastNotification("已從收藏名單移除", "info");
            } else {
                const target = findPlaceById(placeId);
                if (target) {
                    const minimalSave = {
                        place_id: target.place_id,
                        name: target.name,
                        rating: target.rating,
                        user_ratings_total: target.user_ratings_total,
                        gourmetScore: target.gourmetScore,
                        formatted_address: target.formatted_address || target.vicinity || '',
                        photoUrl: target.photoUrl || target.photos?.[0]?.getUrl({ maxWidth: 450, maxHeight: 300 }) || '',
                        url: target.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target.name)}&query_place_id=${target.place_id}`,
                        formatted_phone_number: target.formatted_phone_number || '',
                        price_level: target.price_level,
                        travelInfo: target.travelInfo,
                        isJapan: AppState.isJapanRegion
                    };
                    AppState.favorites.unshift(minimalSave);
                    showToastNotification("已加入我的美食珍藏！", "heart");

           ========================================================================== */
        async function executeSearch(reset = true) {
            if (!placesService) {
                showToastNotification("地圖服務加載中，請稍候重試", "warning");
                return;
            }

            const resultsGrid = document.getElementById('results-grid');
            const metaHeader = document.getElementById('results-meta-header');
            const paginationEl = document.getElementById('pagination-controls');

            if (reset) {
                AppState.allRawPlaces = [];
                AppState.enrichedPlaces = [];
                AppState.renderedCount = 0;
                paginationEl.innerHTML = '';
                renderLoadingSkeletons();
            }

            try {
                if (AppState.area === 'current_location' && !AppState.userLocation) {
                    await acquireUserLocation();
                }

                if (reset) {
                    const fetchedPlaces = await fetchCandidatePlaces(AppState.area, AppState.userLocation);

                        const targetCuisineText = AppState.cuisine ? `「${escapeHtml(AppState.cuisine)}」` : '符合條件的美味餐廳';
                        resultsGrid.innerHTML = `

                                <div class="text-4xl mb-2">🍽️</div>
                                <h4 class="text-sm font-bold text-stone-800">附近找不到 ${targetCuisineText}</h4>
                                <p class="text-xs text-stone-400 mt-1">試試切換為「🚗 開車 (5公里範圍)」，或換個關鍵字再試一次</p>
                            </div>
                        `;
                        metaHeader.classList.add('hidden');
                        return;
                    }

                    AppState.allRawPlaces = fetchedPlaces;
                    sortRawCandidates();
                }

                await renderCardsBatch(reset);

            } catch (err) {
                console.error("[Search Error]", err);
                resultsGrid.innerHTML = `
                    <div class="col-span-full p-4 rounded-2xl bg-rose-50 text-rose-700 text-xs text-center border border-rose-200">
                        搜尋發生狀況：${escapeHtml(err.message || '請確認網路狀態或更換地區')}
                    </div>
                `;
            }
        }

        function fetchCandidatePlaces(area, loc) {
            return new Promise(async (resolve, reject) => {
                let requestConfig;
                const keywordTerm = AppState.cuisine || '美食餐廳';
                let thresholdRating = 4.0;
                const japanBadge = document.getElementById('japan-mode-badge');

                if (area === 'current_location') {
                    if (!loc) return reject(new Error("無法取得定位資訊，請點選右上角「地點設定」選擇商圈"));

                    AppState.searchCenterLocation = new google.maps.LatLng(loc.lat, loc.lng);

                    try {
                        const geoResult = await resolveReverseGeocode(loc);
                        AppState.isJapanRegion = geoResult.address_components?.some(c => c.short_name === 'JP') || false;
                        if (AppState.isJapanRegion) {
                            thresholdRating = 3.5;
                            japanBadge.classList.remove('hidden');
                            document.getElementById('current-region-badge').textContent = '🇯🇵 日本老饕模式 (3.5★門檻)';
                        } else {
                            japanBadge.classList.add('hidden');
                            document.getElementById('current-region-badge').textContent = '📍 目前位置附近';
                        }
                    } catch (e) {
                        console.warn("無法辨別區域國家代碼", e);
                    }

                    if (AppState.transportMode === 'walking') {
                        requestConfig = {
                            location: AppState.searchCenterLocation,
                            rankBy: google.maps.places.RankBy.DISTANCE,
                            keyword: keywordTerm
                        };
                    } else {
                        requestConfig = {
                            location: AppState.searchCenterLocation,
                            radius: 5000,
                            keyword: keywordTerm
                        };
                    }
                } else {
                    try {
                        const geoTarget = await resolveForwardGeocode(area);
                        AppState.isJapanRegion = geoTarget.isJapan;
                        AppState.searchCenterLocation = geoTarget.location;

                        if (AppState.isJapanRegion) {
                            thresholdRating = 3.5;
                            japanBadge.classList.remove('hidden');
                            document.getElementById('current-region-badge').textContent = `🇯🇵 ${area}`;
                        } else {
                            japanBadge.classList.add('hidden');
                            document.getElementById('current-region-badge').textContent = `📍 ${area}`;
                        }

                        const searchRadius = AppState.transportMode === 'walking' ? 1500 : 5000;
                        requestConfig = {
                            location: geoTarget.location,
                            radius: searchRadius,
                            keyword: `${area} ${keywordTerm}`
                        };
                    } catch (e) {
                        return reject(e);
                    }
                }

                let collectedPlaces = [];
                let pageIteration = 0;
                const refCenter = AppState.userLocation
                    ? new google.maps.LatLng(AppState.userLocation.lat, AppState.userLocation.lng)
                    : AppState.searchCenterLocation;

                placesService.nearbySearch(requestConfig, (results, status, pagination) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                        const qualified = results.filter(p => {
                            if ((p.rating || 0) < thresholdRating || (p.user_ratings_total || 0) < 8) return false;

                            if (p.geometry?.location && refCenter) {
                                const distMeters = google.maps.geometry.spherical.computeDistanceBetween(refCenter, p.geometry.location);
                                p.linearDistanceMeters = distMeters;

                                if (area === 'current_location') {
                                    if (AppState.transportMode === 'walking' && distMeters > 1150) return false;
                                    if (AppState.transportMode === 'driving' && distMeters > 5000) return false;
                                }
                            }

                            p.gourmetScore = computeGourmetScore(p, AppState.isJapanRegion);
                            return true;
                        });

                        collectedPlaces = collectedPlaces.concat(qualified);
                        pageIteration++;

                        if (pagination && pagination.hasNextPage && pageIteration < 3) {
                            setTimeout(() => pagination.nextPage(), 1800);
                        } else {
                            resolve(collectedPlaces);
                        }
                    } else if (status === google.maps.places.PlacesServiceStatus.ZERO_RESULTS) {
                        resolve([]);
                    } else {
                        if (pageIteration === 0) reject(new Error("搜尋服務回應：" + status));
                        else resolve(collectedPlaces);
                    }
                });
            });
        }

        /* ==========================================================================
           分批並行驗證路線與詳情 (先算路線、通過才查詳情，省下 60%+ API 額度)
           ========================================================================== */
        async function renderCardsBatch(isReset = false) {
            const resultsGrid = document.getElementById('results-grid');
            const metaHeader = document.getElementById('results-meta-header');
            
            if (isReset) {
                resultsGrid.innerHTML = '';
            }

            let newlyAddedCount = 0;
            while (newlyAddedCount < 6 && AppState.renderedCount < AppState.allRawPlaces.length) {
                const currentBatch = AppState.allRawPlaces.slice(
                    AppState.renderedCount,
                    AppState.renderedCount + AppState.batchSize
                );
                AppState.renderedCount += currentBatch.length;

                if (currentBatch.length === 0) break;

                const processedList = await executeWithConcurrency(
                    currentBatch,
                    place => enrichPlaceDetails(place, AppState.userLocation),
                    4
                );

                const validList = processedList.filter(item => item !== null);
                AppState.enrichedPlaces.push(...validList);
                newlyAddedCount += validList.length;

                if (AppState.transportMode !== 'walking' || AppState.area !== 'current_location') {
                    break;
                }
            }

            metaHeader.classList.remove('hidden');
            updateResultsHeaderBadge();
            applyClientFiltersAndRender();
            updatePaginationUI();
        }

        function updateResultsHeaderBadge() {
            const badge = document.getElementById('results-filter-badge');
            if (AppState.isJapanRegion) {
                badge.textContent = '🇯🇵 日本精選 (3.5★+)';
                badge.className = 'bg-amber-50 text-amber-900 border border-amber-200/80 px-2 py-0.5 rounded-md font-bold text-xs';
            } else {
                badge.textContent = '老饕加權 (4.0★+)';
                badge.className = 'bg-orange-50 text-orange-700 border border-orange-200/70 px-2 py-0.5 rounded-md font-bold text-xs';
            }
        }

        async function executeWithConcurrency(items, asyncFn, limit = 4) {
            const results = [];
            const executing = [];
            for (const item of items) {
                const p = Promise.resolve().then(() => asyncFn(item));
                results.push(p);
                if (limit <= items.length) {
                    const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                    executing.push(e);
                    if (executing.length >= limit) {
                        await Promise.race(executing);
                    }
                }
            }
            return Promise.all(results);
        }

        async function enrichPlaceDetails(place, userLoc) {
            const travelInfo = await evaluateTravelDistance(place, userLoc);
            if (travelInfo === false) {
                return null;
            }

            if (AppState.detailsCache.has(place.place_id)) {
                const cached = AppState.detailsCache.get(place.place_id);
                cached.travelInfo = travelInfo;
                cached.gourmetScore = place.gourmetScore;
                cached.linearDistanceMeters = place.linearDistanceMeters;
                return cached;
            }

            return new Promise(resolve => {
                placesService.getDetails({
                    placeId: place.place_id,
                    fields: ['name', 'rating', 'user_ratings_total', 'formatted_address', 'photos', 'place_id', 'opening_hours', 'url', 'price_level', 'geometry', 'types', 'formatted_phone_number']
                }, (detail, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK && detail) {
                        detail.travelInfo = travelInfo;
                        detail.gourmetScore = place.gourmetScore;
                        detail.linearDistanceMeters = place.linearDistanceMeters;
                        AppState.detailsCache.set(place.place_id, detail);
                        resolve(detail);
                    } else {
                        const fallback = {
                            ...place,
                            formatted_address: place.vicinity || '',
                            travelInfo
                        };
                        resolve(fallback);
                    }
                });
            });
        }

        async function evaluateTravelDistance(place, userLoc) {
            const locObj = place.geometry?.location;
            if (!locObj) return null;

            const originRef = userLoc
                ? new google.maps.LatLng(userLoc.lat, userLoc.lng)
                : AppState.searchCenterLocation;

            if (!originRef) return null;

            const linearDistanceMeters = place.linearDistanceMeters ?? google.maps.geometry.spherical.computeDistanceBetween(originRef, locObj);
            place.linearDistanceMeters = linearDistanceMeters;

            if (AppState.area === 'current_location' && userLoc) {
                if (AppState.transportMode === 'walking') {
                    if (linearDistanceMeters > 1150) return false;

                    const routeResult = await queryWalkingRoute(originRef, locObj, place.place_id);
                    if (routeResult && routeResult.seconds <= 600) {
                        return {
                            text: `${routeResult.distanceText}・${routeResult.durationText}`,
                            isWalking: true
                        };
                    }
                    return false;
                } else {
                    if (linearDistanceMeters > 5000) return false;
                    const distFormatted = linearDistanceMeters >= 1000 
                        ? (linearDistanceMeters / 1000).toFixed(1) + ' km' 
                        : Math.round(linearDistanceMeters) + ' m';
                    return { text: `${distFormatted} (直線)`, isWalking: false };
                }
            } else {
                const distFormatted = linearDistanceMeters >= 1000 
                    ? (linearDistanceMeters / 1000).toFixed(1) + ' km' 
                    : Math.round(linearDistanceMeters) + ' m';
                return { text: `${distFormatted}`, isWalking: false };
            }
        }

        function queryWalkingRoute(origin, destination, placeId) {
            if (placeId && AppState.routeCache.has(placeId)) {
                return Promise.resolve(AppState.routeCache.get(placeId));
            }
            return new Promise(resolve => {
                directionsService.route({
                    origin,
                    destination,
                    travelMode: google.maps.TravelMode.WALKING
                }, (response, status) => {
                    if (status === google.maps.DirectionsStatus.OK && response?.routes?.[0]?.legs?.[0]) {
                        const leg = response.routes[0].legs[0];
                        const routeData = {
                            distanceText: leg.distance.text,
                            durationText: leg.duration.text,
                            seconds: leg.duration.value
                        };
                        if (placeId) AppState.routeCache.set(placeId, routeData);
                        resolve(routeData);
                    } else {
                        resolve(null);
                    }
                });
            });
        }

        function resolveForwardGeocode(address) {
            return new Promise((resolve, reject) => {
                if (AppState.geocodeCache.has(address)) {
                    return resolve(AppState.geocodeCache.get(address));
                }
                geocoder.geocode({ address }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        const isJapan = results[0].address_components?.some(c => c.short_name === 'JP') || false;
                        const data = { location: results[0].geometry.location, isJapan };
                        AppState.geocodeCache.set(address, data);
                        resolve(data);
                    } else {
                        reject(new Error("找不到該地區座標，請嘗試輸入更具體的商圈名稱"));
                    }
                });
            });
        }

        function resolveReverseGeocode(coords) {
            return new Promise((resolve, reject) => {
                geocoder.geocode({ location: coords }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        resolve(results[0]);
                    } else {
                        reject(status);
                    }
                });
            });
        }
