<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>美食探險家</title>
    
    <!-- PWA & Mobile Web Capabilities -->
    <link id="manifest-link" rel="manifest">
    <meta name="theme-color" content="#ea580c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="美食探險家">
    <link rel="apple-touch-icon" href="https://placehold.co/192x192/ea580c/ffffff?text=食">

    <!-- Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ea580c;
            --primary-light: #f97316;
            --primary-surface: #fff7ed;
            --bg-canvas: #fafaf9;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-canvas);
            -webkit-tap-highlight-color: transparent;
            padding-bottom: env(safe-area-inset-bottom, 24px);
        }

        /* 隱藏滾動條 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* 卡片進場動態效果 */
        @keyframes subtle-fade-slide {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-card {
            animation: subtle-fade-slide 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }

        /* 觸控微反饋 */
        .tap-active:active {
            transform: scale(0.96);
            transition: transform 0.1s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        /* 愛心收藏彈跳效果 */
        @keyframes heart-pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .animate-pop {
            animation: heart-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 骨架屏光暈 Shimmer 動態 */
        @keyframes shimmer-move {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .skeleton-shimmer {
            background: linear-gradient(90deg, #f5f5f4 25%, #e7e5e4 50%, #f5f5f4 75%);
            background-size: 200% 100%;
            animation: shimmer-move 1.6s infinite ease-in-out;
        }

        /* 頂部 Header 滾動收折過渡 */
        #collapsible-controls {
            transition: max-height 0.28s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.22s ease, transform 0.25s ease;
            max-height: 280px;
            opacity: 1;
            transform: translateY(0);
            overflow: hidden;
        }
        #collapsible-controls.collapsed {
            max-height: 0;
            opacity: 0;
            transform: translateY(-8px);
            pointer-events: none;
            margin-bottom: 0 !important;
            padding-bottom: 0 !important;
        }

        /* 收折狀態下的迷你狀態膠囊條 */
        #collapsed-pill-bar {
            transition: max-height 0.25s ease, opacity 0.2s ease;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        #collapsed-pill-bar.active {
            max-height: 48px;
            opacity: 1;
        }

        /* Bottom Sheet 抽屜動態 */
        .sheet-backdrop {
            transition: opacity 0.28s ease;
            opacity: 0;
            pointer-events: none;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .sheet-backdrop.active {
            opacity: 1;
            pointer-events: auto;
        }
        .sheet-panel {
            transition: transform 0.32s cubic-bezier(0.2, 0.9, 0.25, 1);
            transform: translateY(100%);
            max-height: 88vh;
        }
        .sheet-panel.active {
            transform: translateY(0);
        }

        body.prevent-scroll {
            overflow: hidden;
            touch-action: none;
        }
    </style>
</head>
<body class="text-stone-800 antialiased selection:bg-orange-100 selection:text-orange-800">

    <!-- 頂部主面板與全域篩選 -->
    <header id="main-header" class="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b border-stone-200/90 shadow-xs transition-shadow duration-200">
        <div class="max-w-5xl mx-auto px-4 pt-3 pb-2.5">
            
            <!-- 品牌列與動作按鈕 -->
            <div class="flex items-center justify-between gap-3 mb-2.5">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 bg-linear-to-tr from-orange-600 to-amber-500 rounded-xl flex items-center justify-center text-white font-black text-base shadow-sm shadow-orange-200">
                        食
                    </div>
                    <div>
                        <div class="flex items-center gap-1.5">
                            <h1 class="text-base font-extrabold text-stone-900 leading-tight">美食探險家</h1>
                            <span id="japan-mode-badge" class="hidden text-[11px] font-bold px-1.5 py-0.5 rounded-md bg-amber-100 text-amber-900 border border-amber-200/60">🇯🇵 3.5★</span>
                        </div>
                        <span id="current-region-badge" class="text-xs font-semibold text-stone-500 tracking-tight">📍 目前位置附近</span>
                    </div>
                </div>

                <!-- 頂部快捷按鈕群：收藏與地點設定 -->
                <div class="flex items-center gap-2">
                    <button id="favorites-toggle-btn" class="tap-active flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-bold bg-stone-100 text-stone-700 hover:bg-stone-200/80 transition-colors">
                        <span id="fav-icon" class="text-rose-500">❤️</span>
                        <span>收藏 (<span id="fav-count">0</span>)</span>
                    </button>
                    
                    <button id="search-trigger-btn" class="tap-active flex items-center gap-1.5 bg-orange-50 border border-orange-200/80 text-orange-700 px-3 py-1.5 rounded-full text-xs font-bold hover:bg-orange-100 transition-colors">
                        <span id="search-bar-label" class="truncate max-w-[110px] sm:max-w-[170px]">地點設定</span>
                        <svg class="w-3.5 h-3.5 opacity-75" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" /></svg>
                    </button>
                </div>
            </div>

            <!-- 收折時出現的極窄狀態膠囊條 -->
            <div id="collapsed-pill-bar" class="flex items-center justify-between pb-1 pt-0.5">
                <button onclick="expandControlsHeader()" class="tap-active flex items-center gap-2 text-xs font-bold text-orange-700 bg-orange-50/90 border border-orange-200/90 px-3.5 py-1.5 rounded-full shadow-2xs">
                    <span id="collapsed-summary-text">📍 附近 · 🍽️ 全部 · 🚶 步行</span>
                    <svg class="w-3.5 h-3.5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7" /></svg>
                </button>
                <div class="flex items-center gap-1 text-xs text-stone-500 font-semibold">
                    <button onclick="triggerRandomPick()" class="tap-active flex items-center gap-1 px-2.5 py-1 rounded-full bg-amber-50 text-amber-800 border border-amber-200/80 font-bold">
                        <span>🎲</span>
                        <span>幫我選</span>
                    </button>
                </div>
            </div>

            <!-- 可收折區域：交通方式切換器 + 美食標籤雲 -->
            <div id="collapsible-controls">
                
                <!-- 交通方式切換器 -->
                <div class="grid grid-cols-2 gap-2 bg-stone-100 p-1 rounded-xl mb-2.5">
                    <button id="mode-walk-btn" onclick="switchTransportMode('walking')" class="tap-active py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 bg-white text-orange-600 shadow-xs transition-all">
                        <span>🚶</span>
                        <span>步行 (10分可達)</span>
                    </button>
                    <button id="mode-drive-btn" onclick="switchTransportMode('driving')" class="tap-active py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900 transition-all">
                        <span>🚗</span>
                        <span>開車 (5公里範圍)</span>
                    </button>
                </div>

                <!-- 智慧兩段式標籤雲 (預設常用 + 展開更多) -->
                <div class="flex flex-wrap gap-1.5 justify-start">
                    <!-- 首屏常駐 7 款熱門標籤 -->
                    <button onclick="handleQuickSelect('')" data-cuisine="" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-orange-600 text-white shadow-xs">
                        🍽️ 全部美食
                    </button>
                    <button onclick="handleQuickSelect('牛肉麵')" data-cuisine="牛肉麵" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🍜 牛肉麵
                    </button>
                    <button onclick="handleQuickSelect('火鍋')" data-cuisine="火鍋" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🍲 火鍋
                    </button>
                    <button onclick="handleQuickSelect('日式料理')" data-cuisine="日式料理" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🍣 日式料理
                    </button>
                    <button onclick="handleQuickSelect('韓式料理')" data-cuisine="韓式料理" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🥘 韓式料理
                    </button>
                    <button onclick="handleQuickSelect('咖啡廳')" data-cuisine="咖啡廳" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        ☕ 咖啡廳
                    </button>
                    <button onclick="handleQuickSelect('早午餐')" data-cuisine="早午餐" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                        🥞 早午餐
                    </button>

                    <!-- 第二段隱藏標籤群 (點擊後平滑展開) -->
                    <div id="more-tags-tray" class="contents hidden">
                        <button onclick="handleQuickSelect('義大利麵')" data-cuisine="義大利麵" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🍝 義大利麵
                        </button>
                        <button onclick="handleQuickSelect('小吃')" data-cuisine="小吃" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🥟 在地小吃
                        </button>
                        <button onclick="handleQuickSelect('甜點')" data-cuisine="甜點" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🍰 精緻甜點
                        </button>
                        <button onclick="handleQuickSelect('美式漢堡')" data-cuisine="美式漢堡" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🍔 美式漢堡
                        </button>
                        <button onclick="handleQuickSelect('居酒屋')" data-cuisine="居酒屋" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🍶 居酒屋
                        </button>
                        <button onclick="handleQuickSelect('素食')" data-cuisine="素食" class="tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70">
                            🥗 蔬食素食
                        </button>
                    </div>

                    <!-- 展開/收起切換鈕 -->
                    <button id="toggle-more-tags-btn" onclick="toggleMoreTags()" class="tap-active px-3 py-1.5 rounded-lg text-xs font-bold text-orange-700 bg-orange-50 hover:bg-orange-100 border border-orange-200/70 flex items-center gap-1 transition-colors">
                        <span>＋更多種類</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-5xl mx-auto px-4 pt-3.5 pb-20 min-h-[78vh]">
        
        <!-- 全域狀態/錯誤通知欄 -->
        <div id="status-toast-bar" class="hidden mb-3 p-3 rounded-xl text-xs font-semibold text-center border transition-all"></div>

        <!-- 搜尋結果資訊與檢視切換列 -->
        <div id="results-meta-header" class="hidden flex items-center justify-between pb-3 text-xs text-stone-600">
            <div class="flex items-center gap-2">
                <span id="results-count-text" class="font-bold text-stone-800">探索結果</span>
                <span id="results-filter-badge" class="bg-orange-50 text-orange-700 border border-orange-200/70 px-2 py-0.5 rounded-md font-bold text-xs">4.0★ 推薦</span>
            </div>
            
            <!-- 雙重視圖切換 (大圖雜誌 vs 緊湊清單) -->
            <div class="flex items-center bg-stone-100 p-0.5 rounded-lg border border-stone-200/70">
                <button id="view-magazine-btn" onclick="switchViewMode('magazine')" class="tap-active px-2.5 py-1 rounded-md text-xs font-bold bg-white text-orange-600 shadow-2xs flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                    <span>大圖</span>
                </button>
                <button id="view-compact-btn" onclick="switchViewMode('compact')" class="tap-active px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" /></svg>
                    <span>清單</span>
                </button>
            </div>
        </div>

        <!-- 結果卡片容器 (依 viewMode 動態變更 grid 樣式) -->
        <div id="results-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
            <!-- 初始啟動引導面板 -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-center">
                <div class="w-16 h-16 bg-orange-50 text-orange-600 rounded-2xl flex items-center justify-center text-3xl mb-3 shadow-xs border border-orange-100">
                    🧭
                </div>
                <h3 class="text-base font-bold text-stone-900 mb-1">發現身邊隱藏的神級美食</h3>
                <p class="text-xs text-stone-500 max-w-xs mb-4">點選上方種類立刻開吃，或一鍵鎖定附近步行好店。</p>
                <button onclick="executeSearch(true)" class="tap-active px-5 py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-xs font-bold shadow-md shadow-orange-200 transition-all flex items-center gap-2">
                    <span>📍</span>
                    <span>探索我附近的必吃名店</span>
                </button>
            </div>
        </div>

        <!-- 分頁載入控制器 -->
        <div id="pagination-controls" class="mt-8 flex justify-center"></div>
    </main>

    <!-- 右下角浮動功能按鈕群 -->
    <div class="fixed bottom-6 right-5 z-20 flex flex-col items-end gap-2.5">
        <!-- 🎲 幫我選一家 (吃什麼輪盤) 浮動按鈕 -->
        <button id="floating-random-btn" onclick="triggerRandomPick()" class="hidden tap-active bg-linear-to-r from-amber-500 to-orange-500 text-white px-4 py-2.5 rounded-full shadow-lg border border-amber-300/40 flex items-center gap-1.5 text-xs font-extrabold hover:brightness-105 transition-all">
            <span class="text-base">🎲</span>
            <span>幫我選一家</span>
        </button>

        <!-- 回到頂端按鈕 -->
        <button id="floating-top-btn" class="hidden w-11 h-11 bg-white/95 text-stone-700 rounded-full shadow-lg border border-stone-200/90 flex items-center justify-center tap-active transition-all">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18" /></svg>
        </button>
    </div>

    <!-- 🎲 隨機選店彈出視窗 (Modal) -->
    <div id="random-picker-modal" class="fixed inset-0 z-50 flex items-center justify-center px-4 bg-stone-900/60 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-250">
        <div class="bg-white rounded-3xl max-w-sm w-full p-5 shadow-2xl border border-stone-100 transform scale-95 transition-transform duration-250" id="random-card-content">
            <!-- 內容由 JS 動態注入 -->
        </div>
    </div>

    <!-- 搜尋地區設定：現代化 Bottom Sheet -->
    <div id="sheet-overlay" class="sheet-backdrop fixed inset-0 bg-stone-900/60 z-40"></div>
    <div id="sheet-modal" class="sheet-panel fixed bottom-0 left-0 right-0 bg-white z-50 rounded-t-[28px] shadow-2xl flex flex-col max-w-2xl mx-auto">
        
        <!-- 拖曳握把 -->
        <div class="w-full flex justify-center pt-3 pb-1.5 flex-shrink-0 cursor-pointer" onclick="closeLocationSheet()">
            <div class="w-10 h-1.5 bg-stone-300 rounded-full"></div>
        </div>

        <!-- 視窗標題 -->
        <div class="px-5 py-3 flex items-center justify-between border-b border-stone-100 flex-shrink-0">
            <div>
                <h2 class="text-base font-extrabold text-stone-900">選擇探索地區</h2>
                <p class="text-xs text-stone-400">點選直接套用，立刻開始搜尋</p>
            </div>
            <button onclick="closeLocationSheet()" class="p-2 rounded-full bg-stone-100 text-stone-500 tap-active">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M6 18L18 6M6 6l12 12" /></svg>
            </button>
        </div>

        <!-- 滾動內容區 -->
        <div class="flex-grow overflow-y-auto p-5 space-y-4 no-scrollbar">
            
            <!-- 目前位置模式快捷按鈕 -->
            <button onclick="selectTargetArea('current_location', '📍 目前位置附近')" class="tap-active w-full p-3.5 rounded-2xl bg-orange-50/80 border border-orange-200/90 flex items-center justify-between text-left group">
                <div class="flex items-center gap-3">
                    <span class="w-10 h-10 rounded-xl bg-orange-600 text-white flex items-center justify-center text-lg shadow-xs">📍</span>
                    <div>
                        <div class="text-xs font-bold text-stone-900">目前所在位置</div>
                        <div class="text-xs text-orange-700 font-medium">使用即時 GPS 自動定位附近店家</div>
                    </div>
                </div>
                <span class="text-xs font-bold text-orange-700 bg-white px-2.5 py-1 rounded-full shadow-2xs">立即定位</span>
            </button>

            <!-- 最近搜尋紀錄 (若有) -->
            <div id="recent-searches-box" class="hidden">
                <span class="text-xs font-bold text-stone-400 block mb-1.5 uppercase tracking-wider">最近查詢紀錄</span>
                <div id="recent-searches-chips" class="flex flex-wrap gap-1.5"></div>
            </div>

            <!-- 自訂地點輸入區塊 -->
            <div class="bg-stone-50 p-3.5 rounded-2xl border border-stone-200/80">
                <label class="text-xs font-bold text-stone-500 block mb-1.5">輸入自訂鄉鎮市區 / 海外城市</label>
                <div class="flex gap-2">
                    <input id="custom-area-input" type="text" placeholder="例如：台中西區、東京新宿、台南中西區" class="flex-1 bg-white border border-stone-200 rounded-xl px-3.5 py-2.5 text-xs text-stone-800 outline-none focus:border-orange-500 focus:ring-1 focus:ring-orange-500">
                    <button onclick="handleCustomAreaSubmit()" class="tap-active px-4 py-2.5 bg-stone-900 text-white font-bold rounded-xl text-xs hover:bg-stone-800">
                        設定
                    </button>
                </div>
            </div>

            <!-- 熱門城市與商圈快捷清單 -->
            <div>
                <span class="text-xs font-bold text-stone-400 block mb-2 uppercase tracking-wider">熱門都會商圈 (點選即搜尋)</span>
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <button onclick="selectTargetArea('台北市信義區', '台北市 信義區')" class="tap-active p-3 rounded-xl bg-stone-50 hover:bg-orange-50 hover:text-orange-700 border border-stone-200/70 text-left font-semibold transition-colors">台北市 信義區</button>
                    <button onclick="selectTargetArea('台北市大安區', '台北市 大安區')" class="tap-active p-3 rounded-xl bg-stone-50 hover:bg-orange-50 hover:text-orange-700 border border-stone-200/70 text-left font-semibold transition-colors">台北市 大安區</button>
                    <button onclick="selectTargetArea('台北市中山區', '台北市 中山區')" class="tap-active p-3 rounded-xl bg-stone-50 hover:bg-orange-50 hover:text-orange-700 border border-stone-200/70 text-left font-semibold transition-colors">台北市 中山區</button>
                    <button onclick="selectTargetArea('台北市中正區', '台北市 中正區')" class="tap-active p-3 rounded-xl bg-stone-50 hover:bg-orange-50 hover:text-orange-700 border border-stone-200/70 text-left font-semibold transition-colors">台北市 中正區</button>
                    <button onclick="selectTargetArea('新北市板橋區', '新北市 板橋區')" class="tap-active p-3 rounded-xl bg-stone-50 hover:bg-orange-50 hover:text-orange-700 border border-stone-200/70 text-left font-semibold transition-colors">新北市 板橋區</button>
                    <button onclick="selectTargetArea('台中市西區', '台中市 西區')" class="tap-active p-3 rounded-xl bg-stone-50 hover:bg-orange-50 hover:text-orange-700 border border-stone-200/70 text-left font-semibold transition-colors">台中市 西區</button>
                    <button onclick="selectTargetArea('台南市中西區', '台南市 中西區')" class="tap-active p-3 rounded-xl bg-stone-50 hover:bg-orange-50 hover:text-orange-700 border border-stone-200/70 text-left font-semibold transition-colors">台南市 中西區</button>
                    <button onclick="selectTargetArea('高雄市左營區', '高雄市 左營區')" class="tap-active p-3 rounded-xl bg-stone-50 hover:bg-orange-50 hover:text-orange-700 border border-stone-200/70 text-left font-semibold transition-colors">高雄市 左營區</button>
                    <button onclick="selectTargetArea('日本東京新宿', '🇯🇵 東京新宿 (老饕模式)')" class="tap-active p-3 rounded-xl bg-amber-50/80 hover:bg-amber-100 border border-amber-200/90 text-amber-950 text-left font-bold transition-colors">🇯🇵 東京新宿 (3.5★)</button>
                    <button onclick="selectTargetArea('日本大阪難波', '🇯🇵 大阪難波 (老饕模式)')" class="tap-active p-3 rounded-xl bg-amber-50/80 hover:bg-amber-100 border border-amber-200/90 text-amber-950 text-left font-bold transition-colors">🇯🇵 大阪難波 (3.5★)</button>
                </div>
            </div>

            <div class="h-6"></div>
        </div>
    </div>

    <!-- 浮動 Toast 提示 -->
    <div id="toast-notify" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 transform -translate-y-2">
        <div class="bg-stone-900/90 backdrop-blur-md text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2">
            <span id="toast-icon">ℹ️</span>
            <span id="toast-text">提示訊息</span>
        </div>
    </div>

    <script>
        /* ==========================================================================
           全域應用程式狀態
           ========================================================================== */
        const AppState = {
            area: 'current_location',
            areaName: '📍 目前位置附近',
            cuisine: '',
            cuisineName: '所有美食',
            transportMode: 'walking', // 'walking' | 'driving'
            displayMode: localStorage.getItem('food_explorer_view_mode') || 'magazine', // 'magazine' | 'compact'
            isJapanRegion: false,
            userLocation: null,
            allRawPlaces: [],
            renderedCount: 0,
            batchSize: 18,
            isLoading: false,
            viewMode: 'explore', // 'explore' | 'favorites'
            favorites: JSON.parse(localStorage.getItem('food_explorer_favorites') || '[]'),
            recentSearches: JSON.parse(localStorage.getItem('food_explorer_recent_searches') || '[]'),
            detailsCache: new Map(),
            geocodeCache: new Map()
        };

        // Google Maps 服務實例
        let placesService = null;
        let directionsService = null;
        let geocoder = null;

        // PWA 離線清單初始化
        (function setupManifest() {
            const manifestObj = {
                name: "美食探險家",
                short_name: "美食探險",
                start_url: ".",
                display: "standalone",
                background_color: "#fafaf9",
                theme_color: "#ea580c",
                icons: [
                    { src: "https://placehold.co/192x192/ea580c/ffffff?text=食", sizes: "192x192", type: "image/png" },
                    { src: "https://placehold.co/512x512/ea580c/ffffff?text=食", sizes: "512x512", type: "image/png" }
                ]
            };
            const blob = new Blob([JSON.stringify(manifestObj)], { type: 'application/json' });
            document.getElementById('manifest-link').href = URL.createObjectURL(blob);
        })();

        /* ==========================================================================
           Google 地圖服務初始化
           ========================================================================== */
        window.initMap = function() {
            try {
                const hiddenNode = document.createElement('div');
                const fallbackCenter = { lat: 25.033964, lng: 121.564468 }; // 台北 101
                const mapInstance = new google.maps.Map(hiddenNode, { center: fallbackCenter, zoom: 14 });
                
                placesService = new google.maps.places.PlacesService(mapInstance);
                directionsService = new google.maps.DirectionsService();
                geocoder = new google.maps.Geocoder();
                
                updateFavoritesCountUI();
                renderRecentSearches();
                initViewModeUI();
                console.log("[FoodExplorer] 升級版 Google Maps 服務已就緒");
                
                // 靜默預先抓取定位以縮短首次查詢延遲
                acquireUserLocation(true).catch(() => {});
            } catch (err) {
                console.error("[FoodExplorer] 地圖初始化失敗:", err);
                showToastNotification("地圖元件加載失敗，請確認 API Key 授權", "error");
            }
        };

        function acquireUserLocation(silent = false) {
            return new Promise((resolve, reject) => {
                if (!navigator.geolocation) {
                    if (!silent) showToastNotification("裝置不支援定位功能", "warning");
                    return reject(new Error("不支援 Geolocation"));
                }

                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        AppState.userLocation = {
                            lat: pos.coords.latitude,
                            lng: pos.coords.longitude
                        };
                        resolve(AppState.userLocation);
                    },
                    (err) => {
                        AppState.userLocation = null;
                        if (!silent) {
                            if (err.code === err.PERMISSION_DENIED) {
                                showToastNotification("未允許定位授權，請手動選擇地區", "warning");
                            } else {
                                showToastNotification("定位逾時，請手動選取商圈", "warning");
                            }
                        }
                        reject(err);
                    },
                    { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 }
                );
            });
        }

        /* ==========================================================================
           頂部 Header 滾動收折機制 (Collapsible Header Engine)
           ========================================================================== */
        let lastScrollPosition = 0;
        let isHeaderCollapsed = false;
        const collapsibleControls = document.getElementById('collapsible-controls');
        const collapsedPillBar = document.getElementById('collapsed-pill-bar');
        const floatingTopBtn = document.getElementById('floating-top-btn');
        const floatingRandomBtn = document.getElementById('floating-random-btn');

        window.addEventListener('scroll', () => {
            const currentY = window.scrollY;
            
            // 浮動按鈕顯示邏輯
            if (currentY > 320) {
                floatingTopBtn.classList.remove('hidden');
                if (AppState.allRawPlaces.length > 0) floatingRandomBtn.classList.remove('hidden');
            } else {
                floatingTopBtn.classList.add('hidden');
                floatingRandomBtn.classList.add('hidden');
            }

            // 向下滾動超過 90px 時收疊頂部控制面板
            if (currentY > 90 && currentY > lastScrollPosition) {
                if (!isHeaderCollapsed) {
                    collapseControlsHeader();
                }
            } 
            // 向上滑動超過 15px 或靠近頂部時自動展開
            else if (currentY < lastScrollPosition - 15 || currentY <= 30) {
                if (isHeaderCollapsed) {
                    expandControlsHeader();
                }
            }

            lastScrollPosition = Math.max(0, currentY);
        }, { passive: true });

        function collapseControlsHeader() {
            isHeaderCollapsed = true;
            collapsibleControls.classList.add('collapsed');
            collapsedPillBar.classList.add('active');
            updateCollapsedPillText();
        }

        function expandControlsHeader() {
            isHeaderCollapsed = false;
            collapsibleControls.classList.remove('collapsed');
            collapsedPillBar.classList.remove('active');
        }

        function updateCollapsedPillText() {
            const areaShort = AppState.areaName.replace('📍 ', '').replace('🇯🇵 ', '');
            const cuisineShort = AppState.cuisineName || '全部';
            const modeIcon = AppState.transportMode === 'walking' ? '🚶 步行' : '🚗 開車';
            document.getElementById('collapsed-summary-text').textContent = `📍 ${areaShort} · 🍽️ ${cuisineShort} · ${modeIcon}`;
        }

        // 兩段式美食標籤展開/收起
        window.toggleMoreTags = function() {
            const tray = document.getElementById('more-tags-tray');
            const btn = document.getElementById('toggle-more-tags-btn');
            if (tray.classList.contains('hidden')) {
                tray.classList.remove('hidden');
                btn.innerHTML = '<span>收起 ▲</span>';
            } else {
                tray.classList.add('hidden');
                btn.innerHTML = '<span>＋更多種類</span>';
            }
        };

        /* ==========================================================================
           大圖 / 緊湊清單 雙重視圖切換
           ========================================================================== */
        window.switchViewMode = function(mode) {
            if (AppState.displayMode === mode) return;
            AppState.displayMode = mode;
            localStorage.setItem('food_explorer_view_mode', mode);
            initViewModeUI();

            // 若目前有顯示的店家，即時重新繪製
            if (AppState.viewMode === 'favorites') {
                renderFavoritesList();
            } else if (AppState.allRawPlaces.length > 0) {
                reRenderCurrentResults();
            }
        };

        function initViewModeUI() {
            const magBtn = document.getElementById('view-magazine-btn');
            const cmpBtn = document.getElementById('view-compact-btn');
            const grid = document.getElementById('results-grid');

            if (AppState.displayMode === 'compact') {
                cmpBtn.className = "tap-active px-2.5 py-1 rounded-md text-xs font-bold bg-white text-orange-600 shadow-2xs flex items-center gap-1";
                magBtn.className = "tap-active px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 flex items-center gap-1";
                grid.className = "grid grid-cols-1 md:grid-cols-2 gap-2.5";
            } else {
                magBtn.className = "tap-active px-2.5 py-1 rounded-md text-xs font-bold bg-white text-orange-600 shadow-2xs flex items-center gap-1";
                cmpBtn.className = "tap-active px-2.5 py-1 rounded-md text-xs font-semibold text-stone-600 flex items-center gap-1";
                grid.className = "grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5";
            }
        }

        function reRenderCurrentResults() {
            const grid = document.getElementById('results-grid');
            grid.innerHTML = '';
            const sliceEnd = Math.min(AppState.renderedCount, AppState.allRawPlaces.length);
            const currentSlice = AppState.allRawPlaces.slice(0, sliceEnd);
            currentSlice.forEach((p, idx) => {
                grid.appendChild(createRestaurantCard(p, idx));
            });
        }

        /* ==========================================================================
           🎲 吃什麼輪盤 (幫我選一家隨機挑店)
           ========================================================================== */
        window.triggerRandomPick = function() {
            const candidates = AppState.viewMode === 'favorites' ? AppState.favorites : AppState.allRawPlaces;
            if (!candidates || candidates.length === 0) {
                showToastNotification("請先搜尋餐廳，才能幫您隨機挑選喔！", "warning");
                return;
            }

            const chosen = candidates[Math.floor(Math.random() * candidates.length)];
            const modal = document.getElementById('random-picker-modal');
            const content = document.getElementById('random-card-content');
            
            const photoUrl = chosen.photoUrl || chosen.photos?.[0]?.getUrl({ maxWidth: 450, maxHeight: 300 }) || 'https://placehold.co/400x260/f5f5f4/78716c?text=推薦店家';
            const mapLink = chosen.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(chosen.name)}&query_place_id=${chosen.place_id}`;

            content.innerHTML = `
                <div class="text-center mb-3">
                    <span class="inline-block p-2 rounded-2xl bg-orange-100 text-orange-600 text-2xl mb-1">🎉</span>
                    <h3 class="text-base font-extrabold text-stone-900">命中註定的美味！</h3>
                    <p class="text-xs text-stone-500">不用再煩惱了，今天就吃這一家：</p>
                </div>

                <div class="rounded-2xl overflow-hidden border border-stone-200/90 mb-3 bg-stone-50">
                    <div class="aspect-video w-full relative">
                        <img src="${photoUrl}" alt="${chosen.name}" class="w-full h-full object-cover">
                        <div class="absolute top-2.5 right-2.5 bg-amber-500 text-white font-black text-xs px-2 py-0.5 rounded-lg shadow-sm">
                            ★ ${chosen.rating ? chosen.rating.toFixed(1) : '–'}
                        </div>
                    </div>
                    <div class="p-3">
                        <h4 class="text-sm font-bold text-stone-900 truncate mb-1">${chosen.name}</h4>
                        <p class="text-xs text-stone-500 truncate mb-1">📍 ${chosen.formatted_address || '附近精選名店'}</p>
                        ${chosen.travelInfo ? `<span class="inline-block text-xs font-bold text-orange-700 bg-orange-50 px-2 py-0.5 rounded">${chosen.travelInfo.isWalking ? '🚶' : '🚗'} ${chosen.travelInfo.text}</span>` : ''}
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="triggerRandomPick()" class="tap-active flex-1 py-2.5 rounded-xl border border-stone-200 text-xs font-bold text-stone-700 hover:bg-stone-50">
                        🔄 換一家
                    </button>
                    <a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="tap-active flex-1 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold text-center flex items-center justify-center gap-1 shadow-sm shadow-orange-200">
                        <span>出發導航</span>
                        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                    </a>
                </div>

                <button onclick="closeRandomPickerModal()" class="w-full mt-2.5 py-1.5 text-xs text-stone-400 hover:text-stone-600 font-medium text-center">
                    關閉
                </button>
            `;

            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('#random-card-content').classList.remove('scale-95');
            document.body.classList.add('prevent-scroll');
        };

        window.closeRandomPickerModal = function() {
            const modal = document.getElementById('random-picker-modal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('#random-card-content').classList.add('scale-95');
            document.body.classList.remove('prevent-scroll');
        };

        document.getElementById('random-picker-modal').addEventListener('click', (e) => {
            if (e.target.id === 'random-picker-modal') closeRandomPickerModal();
        });

        /* ==========================================================================
           使用者反饋與 Toast 模組
           ========================================================================== */
        let toastTimeout = null;
        function showToastNotification(message, type = 'info') {
            const toastEl = document.getElementById('toast-notify');
            const iconEl = document.getElementById('toast-icon');
            const textEl = document.getElementById('toast-text');
            
            const icons = {
                info: '💡',
                success: '✅',
                warning: '⚠️',
                error: '❌',
                heart: '❤️'
            };

            iconEl.textContent = icons[type] || '💡';
            textEl.textContent = message;

            toastEl.classList.remove('opacity-0', '-translate-y-2');
            toastEl.classList.add('opacity-100', 'translate-y-0');

            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('opacity-100', 'translate-y-0');
                toastEl.classList.add('opacity-0', '-translate-y-2');
            }, 2800);
        }

        window.copyToClipboard = function(text, event) {
            if (event) event.stopPropagation();
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
                showToastNotification("已複製地址到剪貼簿", "success");
            } catch (err) {
                showToastNotification("複製失敗，請手動複製", "warning");
            }
            document.body.removeChild(textarea);
        };

        /* ==========================================================================
           我的收藏管理 (Favorites Engine)
           ========================================================================== */
        window.toggleFavorite = function(placeId, event) {
            if (event) event.stopPropagation();
            
            const heartBtn = document.querySelector(`[data-fav-btn="${placeId}"]`);
            if (heartBtn) {
                heartBtn.classList.add('animate-pop');
                setTimeout(() => heartBtn.classList.remove('animate-pop'), 350);
            }

            const existingIndex = AppState.favorites.findIndex(item => item.place_id === placeId);
            if (existingIndex >= 0) {
                AppState.favorites.splice(existingIndex, 1);
                showToastNotification("已從收藏名單移除", "info");
            } else {
                const target = AppState.allRawPlaces.find(p => p.place_id === placeId) || AppState.detailsCache.get(placeId);
                if (target) {
                    const minimalSave = {
                        place_id: target.place_id,
                        name: target.name,
                        rating: target.rating,
                        user_ratings_total: target.user_ratings_total,
                        formatted_address: target.formatted_address || '',
                        photoUrl: target.photoUrl || target.photos?.[0]?.getUrl({ maxWidth: 400, maxHeight: 300 }) || '',
                        url: target.url || `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(target.name)}`,
                        formatted_phone_number: target.formatted_phone_number || '',
                        price_level: target.price_level,
                        travelInfo: target.travelInfo
                    };
                    AppState.favorites.unshift(minimalSave);
                    showToastNotification("已加入我的美食珍藏！", "heart");
                }
            }

            localStorage.setItem('food_explorer_favorites', JSON.stringify(AppState.favorites));
            updateFavoritesCountUI();
            
            if (AppState.viewMode === 'favorites') {
                renderFavoritesList();
            } else {
                updateCardHeartIcon(placeId);
            }
        };

        function updateFavoritesCountUI() {
            document.getElementById('fav-count').textContent = AppState.favorites.length;
        }

        function updateCardHeartIcon(placeId) {
            const btn = document.querySelector(`[data-fav-btn="${placeId}"]`);
            if (btn) {
                const isFav = AppState.favorites.some(f => f.place_id === placeId);
                btn.innerHTML = isFav ? '❤️' : '🤍';
            }
        }

        document.getElementById('favorites-toggle-btn').addEventListener('click', () => {
            if (AppState.viewMode === 'explore') {
                AppState.viewMode = 'favorites';
                document.getElementById('favorites-toggle-btn').classList.add('bg-rose-100', 'text-rose-700', 'border-rose-200');
                renderFavoritesList();
            } else {
                AppState.viewMode = 'explore';
                document.getElementById('favorites-toggle-btn').classList.remove('bg-rose-100', 'text-rose-700', 'border-rose-200');
                if (AppState.allRawPlaces.length > 0) {
                    reRenderCurrentResults();
                    document.getElementById('results-meta-header').classList.remove('hidden');
                    updateResultsHeaderBadge();
                } else {
                    document.getElementById('results-grid').innerHTML = `
                        <div class="col-span-full py-16 text-center text-stone-400 text-xs font-medium">
                            點擊上方標籤開始探索美食
                        </div>
                    `;
                }
            }
        });

        function renderFavoritesList() {
            const grid = document.getElementById('results-grid');
            const metaHeader = document.getElementById('results-meta-header');
            const paginationEl = document.getElementById('pagination-controls');
            paginationEl.innerHTML = '';

            if (AppState.favorites.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full py-16 text-center">
                        <div class="text-4xl mb-2">💔</div>
                        <h4 class="text-sm font-bold text-stone-800">目前尚無收藏店家</h4>
                        <p class="text-xs text-stone-400 mt-1">在探索美食時，點擊卡片上的愛心即可存入名單</p>
                    </div>
                `;
                return;
            }

            metaHeader.classList.remove('hidden');
            document.getElementById('results-count-text').textContent = `我的珍藏清單 (${AppState.favorites.length} 家)`;
            document.getElementById('results-filter-badge').textContent = '❤️ 收藏模式';
            document.getElementById('results-filter-badge').className = 'bg-rose-50 text-rose-700 border border-rose-200 px-2 py-0.5 rounded-md font-bold text-xs';

            grid.innerHTML = '';
            AppState.favorites.forEach((favPlace, idx) => {
                grid.appendChild(createRestaurantCard(favPlace, idx, true));
            });
        }

        /* ==========================================================================
           交通方式與快篩事件交互
           ========================================================================== */
        window.switchTransportMode = function(mode) {
            if (AppState.transportMode === mode) return;
            AppState.transportMode = mode;

            const walkBtn = document.getElementById('mode-walk-btn');
            const driveBtn = document.getElementById('mode-drive-btn');

            if (mode === 'walking') {
                walkBtn.className = "tap-active py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 bg-white text-orange-600 shadow-xs transition-all";
                driveBtn.className = "tap-active py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900 transition-all";
            } else {
                driveBtn.className = "tap-active py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-1.5 bg-white text-orange-600 shadow-xs transition-all";
                walkBtn.className = "tap-active py-2 rounded-lg text-xs font-semibold flex items-center justify-center gap-1.5 text-stone-600 hover:text-stone-900 transition-all";
            }

            updateCollapsedPillText();

            if (AppState.allRawPlaces.length > 0 || AppState.cuisine !== '') {
                executeSearch(true);
            }
        };

        window.handleQuickSelect = function(cuisineName) {
            if (AppState.viewMode === 'favorites') {
                AppState.viewMode = 'explore';
                document.getElementById('favorites-toggle-btn').classList.remove('bg-rose-100', 'text-rose-700');
            }

            AppState.cuisine = cuisineName;
            AppState.cuisineName = cuisineName || '所有美食';

            document.querySelectorAll('.tag-btn').forEach(btn => {
                if (btn.getAttribute('data-cuisine') === cuisineName) {
                    btn.className = "tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-orange-600 text-white shadow-xs";
                } else {
                    btn.className = "tag-btn tap-active px-3 py-1.5 rounded-lg text-xs font-semibold text-stone-700 bg-stone-100 hover:bg-stone-200/70";
                }
            });

        /* ==========================================================================
           核心搜尋引擎與老饕過濾邏輯
           ========================================================================== */
        async function executeSearch(reset = true) {
            if (!placesService) {
                showToastNotification("地圖服務加載中，請稍候重試", "warning");
                return;
            }

            const resultsGrid = document.getElementById('results-grid');
            const metaHeader = document.getElementById('results-meta-header');
            const paginationEl = document.getElementById('pagination-controls');

            if (reset) {
                AppState.allRawPlaces = [];
                AppState.renderedCount = 0;
                paginationEl.innerHTML = '';
                renderLoadingSkeletons();
            }

            try {
                if (AppState.area === 'current_location' && !AppState.userLocation) {
                    await acquireUserLocation();
                }

                if (reset) {
                    const fetchedPlaces = await fetchCandidatePlaces(AppState.area, AppState.userLocation);
                    if (fetchedPlaces.length === 0) {
                        resultsGrid.innerHTML = `
                            <div class="col-span-full py-16 text-center">
                                <div class="text-4xl mb-2">🍽️</div>
                                <h4 class="text-sm font-bold text-stone-800">附近找不到相關美味餐廳</h4>
                                <p class="text-xs text-stone-400 mt-1">試試切換為開車模式，或點選其他美食種類</p>
                            </div>
                        `;
                        metaHeader.classList.add('hidden');
                        return;
                    }

                    // 熱門度優先排序
                    AppState.allRawPlaces = fetchedPlaces.sort((a, b) => (b.user_ratings_total || 0) - (a.user_ratings_total || 0));
                }

                await renderCardsBatch(reset);

            } catch (err) {
                console.error("[Search Error]", err);
                resultsGrid.innerHTML = `
                    <div class="col-span-full p-4 rounded-2xl bg-rose-50 text-rose-700 text-xs text-center border border-rose-200">
                        搜尋發生狀況：${err.message || '請確認網路狀態或更換地區'}
                    </div>
                `;
            }
        }

        function fetchCandidatePlaces(area, loc) {
            return new Promise(async (resolve, reject) => {
                let requestConfig;
                const keywordTerm = AppState.cuisine || '美食餐廳';
                let thresholdRating = 4.0;

                const japanBadge = document.getElementById('japan-mode-badge');

                if (area === 'current_location') {
                    if (!loc) return reject(new Error("無法取得定位資訊"));

                    try {
                        const geoResult = await resolveReverseGeocode(loc);
                        AppState.isJapanRegion = geoResult.address_components?.some(c => c.short_name === 'JP') || false;
                        if (AppState.isJapanRegion) {
                            thresholdRating = 3.5;
                            japanBadge.classList.remove('hidden');
                            document.getElementById('current-region-badge').textContent = '🇯🇵 日本老饕模式 (3.5★門檻)';
                        } else {
                            japanBadge.classList.add('hidden');
                            document.getElementById('current-region-badge').textContent = '📍 目前位置附近';
                        }
                    } catch (e) {
                        console.warn("無法辨別區域國家代碼", e);
                    }

                    const searchRadius = AppState.transportMode === 'walking' ? 1200 : 5000;
                    
                    if (AppState.transportMode === 'walking') {
                        requestConfig = {
                            location: new google.maps.LatLng(loc.lat, loc.lng),
                            rankBy: google.maps.places.RankBy.DISTANCE,
                            keyword: keywordTerm
                        };
                    } else {
                        requestConfig = {
                            location: new google.maps.LatLng(loc.lat, loc.lng),
                            radius: searchRadius,
                            keyword: keywordTerm
                        };
                    }
                } else {
                    try {
                        const geoTarget = await resolveForwardGeocode(area);
                        AppState.isJapanRegion = geoTarget.isJapan;
                        if (AppState.isJapanRegion) {
                            thresholdRating = 3.5;
                            japanBadge.classList.remove('hidden');
                            document.getElementById('current-region-badge').textContent = `🇯🇵 ${area}`;
                        } else {
                            japanBadge.classList.add('hidden');
                            document.getElementById('current-region-badge').textContent = `📍 ${area}`;
                        }

                        requestConfig = {
                            location: geoTarget.location,
                            radius: 5000,
                            keyword: `${area} ${keywordTerm}`
                        };
                    } catch (e) {
                        return reject(e);
                    }
                }

                let collectedPlaces = [];
                let pageIteration = 0;

                placesService.nearbySearch(requestConfig, (results, status, pagination) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK && results) {
                        // 老饕門檻篩選
                        const qualified = results.filter(p => (p.rating || 0) >= thresholdRating && (p.user_ratings_total || 0) >= 8);
                        collectedPlaces = collectedPlaces.concat(qualified);
                        pageIteration++;

                        if (pagination && pagination.hasNextPage && pageIteration < 3) {
                            setTimeout(() => pagination.nextPage(), 1800);
                        } else {
                            resolve(collectedPlaces);
                        }
                    } else if (status === google.maps.places.PlacesServiceStatus.ZERO_RESULTS) {
                        resolve([]);
                    } else {
                        if (pageIteration === 0) reject(new Error("搜尋服務回應：" + status));
                        else resolve(collectedPlaces);
                    }
                });
            });
        }

        /* ==========================================================================
           分批並行獲取詳細資訊 (帶限流與距離運算)
           ========================================================================== */
        async function renderCardsBatch(isReset = false) {
            const resultsGrid = document.getElementById('results-grid');
            const metaHeader = document.getElementById('results-meta-header');
            
            if (isReset) {
                resultsGrid.innerHTML = '';
            }

            const currentBatch = AppState.allRawPlaces.slice(AppState.renderedCount, AppState.renderedCount + AppState.batchSize);
            if (currentBatch.length === 0) return;

            // 限流 4 個並行
            const processedList = await executeWithConcurrency(
                currentBatch,
                place => enrichPlaceDetails(place, AppState.userLocation),
                4
            );

            const validList = processedList.filter(item => item !== null);

            validList.forEach((placeData, index) => {
                resultsGrid.appendChild(createRestaurantCard(placeData, AppState.renderedCount + index));
            });

            AppState.renderedCount += AppState.batchSize;

            metaHeader.classList.remove('hidden');
            document.getElementById('results-count-text').textContent = `已找到 ${resultsGrid.children.length} 家優選餐廳 (全部候選 ${AppState.allRawPlaces.length} 家)`;
            updateResultsHeaderBadge();

            updatePaginationUI();
        }

        function updateResultsHeaderBadge() {
            const badge = document.getElementById('results-filter-badge');
            if (AppState.isJapanRegion) {
                badge.textContent = '🇯🇵 日本精選 (3.5★+)';
                badge.className = 'bg-amber-50 text-amber-900 border border-amber-200/80 px-2 py-0.5 rounded-md font-bold text-xs';
            } else {
                badge.textContent = '高評分推薦 (4.0★+)';
                badge.className = 'bg-orange-50 text-orange-700 border border-orange-200/70 px-2 py-0.5 rounded-md font-bold text-xs';
            }
        }

        async function executeWithConcurrency(items, asyncFn, limit = 4) {
            const results = [];
            const executing = [];
            for (const item of items) {
                const p = Promise.resolve().then(() => asyncFn(item));
                results.push(p);
                if (limit <= items.length) {
                    const e = p.then(() => executing.splice(executing.indexOf(e), 1));
                    executing.push(e);
                    if (executing.length >= limit) {
                        await Promise.race(executing);
                    }
                }
            }
            return Promise.all(results);
        }

        function enrichPlaceDetails(place, userLoc) {
            return new Promise(resolve => {
                if (AppState.detailsCache.has(place.place_id)) {
                    return resolve(applyDistanceFiltering(AppState.detailsCache.get(place.place_id), userLoc));
                }

                placesService.getDetails({
                    placeId: place.place_id,
                    fields: ['name', 'rating', 'user_ratings_total', 'formatted_address', 'photos', 'place_id', 'opening_hours', 'url', 'price_level', 'geometry', 'types', 'formatted_phone_number']
                }, async (detail, status) => {
                    if (status === google.maps.places.PlacesServiceStatus.OK && detail) {
                        AppState.detailsCache.set(place.place_id, detail);
                        const filtered = await applyDistanceFiltering(detail, userLoc);
                        resolve(filtered);
                    } else {
                        const fallback = {
                            ...place,
                            formatted_address: place.vicinity || ''
                        };
                        resolve(fallback);
                    }
                });
            });
        }

        async function applyDistanceFiltering(detail, userLoc) {
            if (!userLoc || !detail.geometry?.location) return detail;

            const userLatLng = new google.maps.LatLng(userLoc.lat, userLoc.lng);
            const linearDistanceMeters = google.maps.geometry.spherical.computeDistanceBetween(userLatLng, detail.geometry.location);

            if (AppState.area === 'current_location') {
                if (AppState.transportMode === 'walking') {
                    if (linearDistanceMeters <= 1200) {
                        const routeResult = await queryWalkingRoute(userLatLng, detail.geometry.location);
                        if (routeResult && routeResult.seconds <= 600) {
                            detail.travelInfo = {
                                text: `${routeResult.distanceText}・${routeResult.durationText}`,
                                isWalking: true
                            };
                            return detail;
                        } else {
                            return null;
                        }
                    } else {
                        return null;
                    }
                } else {
                    if (linearDistanceMeters <= 5000) {
                        const distFormatted = linearDistanceMeters >= 1000 
                            ? (linearDistanceMeters / 1000).toFixed(1) + ' km' 
                            : Math.round(linearDistanceMeters) + ' m';
                        detail.travelInfo = { text: `${distFormatted} (直線)`, isWalking: false };
                        return detail;
                    } else {
                        return null;
                    }
                }
            } else {
                const distFormatted = linearDistanceMeters >= 1000 
                    ? (linearDistanceMeters / 1000).toFixed(1) + ' km' 
                    : Math.round(linearDistanceMeters) + ' m';
                detail.travelInfo = { text: `${distFormatted} (相對)`, isWalking: false };
                return detail;
            }
        }

        function queryWalkingRoute(origin, destination) {
            return new Promise(resolve => {
                directionsService.route({
                    origin,
                    destination,
                    travelMode: google.maps.TravelMode.WALKING
                }, (response, status) => {
                    if (status === google.maps.DirectionsStatus.OK && response?.routes?.[0]?.legs?.[0]) {
                        const leg = response.routes[0].legs[0];
                        resolve({
                            distanceText: leg.distance.text,
                            durationText: leg.duration.text,
                            seconds: leg.duration.value
                        });
                    } else {
                        resolve(null);
                    }
                });
            });
        }

        function resolveForwardGeocode(address) {
            return new Promise((resolve, reject) => {
                if (AppState.geocodeCache.has(address)) {
                    return resolve(AppState.geocodeCache.get(address));
                }
                geocoder.geocode({ address }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        const isJapan = results[0].address_components?.some(c => c.short_name === 'JP') || false;
                        const data = { location: results[0].geometry.location, isJapan };
                        AppState.geocodeCache.set(address, data);
                        resolve(data);
                    } else {
                        reject(new Error("找不到該地區座標，請嘗試輸入更具體的商圈名稱"));
                    }
                });
            });
        }

        function resolveReverseGeocode(coords) {
            return new Promise((resolve, reject) => {
                geocoder.geocode({ location: coords }, (results, status) => {
                    if (status === 'OK' && results[0]) {
                        resolve(results[0]);
                    } else {
                        reject(status);
                    }
                });
            });
        }

                            ${p.formatted_phone_number ? `
                                <a href="tel:${p.formatted_phone_number}" class="tap-active px-3 py-1.5 rounded-lg bg-stone-100 text-stone-700 hover:bg-stone-200 font-bold text-xs" title="撥打電話">
                                    📞 電話
                                </a>
                            ` : ''}
                            <a href="${mapLink}" target="_blank" rel="noopener noreferrer" class="tap-active flex items-center gap-1 text-xs font-bold text-white bg-orange-600 hover:bg-orange-700 px-3.5 py-1.5 rounded-lg shadow-xs transition-colors">
                                <span>導航</span>
                                <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
                            </a>
                        </div>
                    </div>
                </div>
            `;
            return card;
        }

        /* ==========================================================================
           分頁與骨架屏 (Skeleton Loading with Shimmer)
           ========================================================================== */
        function updatePaginationUI() {
            const paginationEl = document.getElementById('pagination-controls');
            paginationEl.innerHTML = '';

            if (AppState.renderedCount < AppState.allRawPlaces.length) {
                const moreBtn = document.createElement('button');
                moreBtn.className = "tap-active px-6 py-2.5 rounded-full bg-white border border-stone-200 text-xs font-bold text-stone-700 shadow-xs hover:border-orange-300 hover:text-orange-600 transition-all flex items-center gap-2";
                moreBtn.innerHTML = `
                    <span>載入更多店家</span>
                    <span class="text-xs text-stone-400">(${AppState.renderedCount} / ${AppState.allRawPlaces.length})</span>
                `;
                moreBtn.onclick = async () => {
                    moreBtn.disabled = true;
                    moreBtn.innerHTML = `<span>處理中...</span>`;
                    await renderCardsBatch(false);
                };
                paginationEl.appendChild(moreBtn);
            }
        }

        function renderLoadingSkeletons() {
            const grid = document.getElementById('results-grid');
            const isCompact = AppState.displayMode === 'compact';

            if (isCompact) {
                grid.innerHTML = Array(6).fill(0).map(() => `
                    <div class="bg-white rounded-2xl border border-stone-200/80 p-3 h-28 flex gap-3">
                        <div class="w-24 h-24 rounded-xl skeleton-shimmer flex-shrink-0"></div>
                        <div class="flex-1 flex flex-col justify-between py-1">
                            <div class="h-4 skeleton-shimmer rounded w-3/4"></div>
                            <div class="h-3 skeleton-shimmer rounded w-1/2"></div>
                            <div class="h-3 skeleton-shimmer rounded w-full"></div>
                        </div>
                    </div>
                `).join('');
                return;
            }

            grid.innerHTML = Array(6).fill(0).map(() => `
                <div class="bg-white rounded-2xl border border-stone-200/80 overflow-hidden h-76 flex flex-col">
                    <div class="aspect-video w-full skeleton-shimmer"></div>
                    <div class="p-3.5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="h-4 skeleton-shimmer rounded w-3/4 mb-2"></div>
                            <div class="h-3 skeleton-shimmer rounded w-1/3 mb-3"></div>
                        </div>
                        <div class="h-3 skeleton-shimmer rounded w-full mt-auto"></div>
                    </div>
                </div>
            `).join('');
        }
    </script>

    <!-- Google Maps JS API 載入 -->
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB-Ev8iMdRHstXwwFL2L6JpghYzgGsbiqY&libraries=places,geometry&callback=initMap&language=zh-TW&loading=async" async defer></script>
</body>
